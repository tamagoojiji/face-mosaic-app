<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>問題を報告する｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.save{margin:var(--s4) 0 0}
.rp fieldset{border:0;margin:0;padding:0;min-width:0}
.rp .lbl{display:block;font-weight:700;font-size:16px;margin:var(--s5) 0 var(--s2);padding:0}
.rp .grp{margin:var(--s4) 0 0}
.rp .grp legend{font-size:14px;font-weight:700;color:var(--sub);margin:0 0 var(--s2);padding:0}
.rp .opt{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:var(--s2) var(--s3);line-height:1.45;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin:0 0 var(--s2);cursor:pointer;background:var(--paper)}
.rp .opt input{width:20px;height:20px;margin:0;accent-color:var(--pri);flex:none}
.rp .opt:has(input:checked){border-color:var(--pri);background:var(--pri-soft);font-weight:600}
.rp textarea{width:100%;min-height:120px;padding:var(--s3) 14px;resize:vertical;line-height:1.6}
.rp select{width:100%;height:48px;padding:0 var(--s3)}
.rp .cnt{text-align:right;font-size:14px;color:var(--sub);margin:var(--s1) 0 0}
.rp .cnt.over{color:var(--warn-tag);font-weight:600}
.rp .pick{position:relative;display:flex;margin:0}
.rp .pick input{position:absolute;opacity:0;width:1px;height:1px}
.rp .pick:focus-within{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--radius)}
.rp .pick.full{color:var(--dis-fg);background:var(--dis-bg);border-color:var(--dis-bg);cursor:default}
.rp .thumbs:empty{display:none}
.rp .thumbs{display:flex;flex-wrap:wrap;gap:var(--s3);margin:var(--s3) 0 0;padding:0;list-style:none}
.rp .thumbs li{width:96px;display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.rp .thumbs img,.rp .thumbs .noprev{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.rp .thumbs .noprev{display:flex;align-items:center;justify-content:center;padding:var(--s1);font-size:12px;line-height:1.4;color:var(--sub);text-align:center}
.rp .thumbs .fn{width:100%;font-size:12px;color:var(--sub);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .thumbs button{min-height:44px;min-width:64px;padding:0 10px;border:0;background:none;color:var(--pri);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
#rpdone{margin-top:var(--s3)}
#rpdone .btn{margin-top:var(--s3)}
.rp{padding-bottom:var(--s6)}
</style>
</head><body>
<div class="bar"><a class="back" href="/settings" aria-label="設定に戻る">‹ 設定</a></div>
<main class="wrap rp">
  <h1>問題を報告する</h1>
  <p class="lead">うまくいかなかったところに近いものを1つ選んで、運営に知らせてください。</p>
  <form id="rpf" novalidate>
    <p class="err" id="rpcerr" role="alert" hidden></p>
    <fieldset class="grp"><legend>送る</legend>
      <label class="opt"><input type="radio" name="rpc" value="up_fail">動画・写真を送れない（途中で止まる・エラーが出る）</label>
      <label class="opt"><input type="radio" name="rpc" value="up_missing">送ったのに一覧に出ない</label>
    </fieldset>
    <fieldset class="grp"><legend>顔を選ぶ</legend>
      <label class="opt"><input type="radio" name="rpc" value="pick_slow">選択画面がなかなか出ない</label>
      <label class="opt"><input type="radio" name="rpc" value="pick_nomatch">残したい人の顔が出てこない（タップできない）</label>
      <label class="opt"><input type="radio" name="rpc" value="pick_false">顔ではないものが顔として出る</label>
    </fieldset>
    <fieldset class="grp"><legend>仕上がり</legend>
      <label class="opt"><input type="radio" name="rpc" value="out_uncovered">顔が隠れていない場面がある</label>
      <label class="opt"><input type="radio" name="rpc" value="out_wrong">残したい人にモザイクがかかった</label>
      <label class="opt"><input type="radio" name="rpc" value="out_rotate">向きがおかしい（横になる など）</label>
      <label class="opt"><input type="radio" name="rpc" value="out_quality">画質が悪い・音が出ない</label>
      <label class="opt"><input type="radio" name="rpc" value="out_style">モザイクの見た目（粗さ・種類）を変えたい</label>
    </fieldset>
    <fieldset class="grp"><legend>保存・通知</legend>
      <label class="opt"><input type="radio" name="rpc" value="save_fail">完成した動画・写真を保存できない</label>
      <label class="opt"><input type="radio" name="rpc" value="notify">LINE の通知が来ない・多い</label>
    </fieldset>
    <fieldset class="grp"><legend>ログイン・契約</legend>
      <label class="opt"><input type="radio" name="rpc" value="login">ログインできない</label>
      <label class="opt"><input type="radio" name="rpc" value="plan_display">プラン・残り回数の表示がおかしい</label>
      <label class="opt"><input type="radio" name="rpc" value="billing">支払い・請求について</label>
    </fieldset>
    <fieldset class="grp"><legend>その他</legend>
      <label class="opt"><input type="radio" name="rpc" value="other">その他（内容を書いてください）</label>
    </fieldset>
    <label class="lbl" for="rpb">内容（任意・その他を選んだときは必須）</label>
    <textarea id="rpb" maxlength="500" placeholder="例: 0:42 あたりで右の人の顔が一瞬見えます"></textarea>
    <p class="cnt" id="rpn" aria-live="polite">あと500文字</p>
    <label class="lbl" for="rpj">対象の動画・写真（任意）</label>
    <select id="rpj"><option value="">選ばない</option></select>
    <label class="opt" id="rpconsentl" style="margin-top:var(--s2)" hidden><input type="checkbox" id="rpconsent">選んだ動画・写真とその完成品を、この報告の調査のために運営が確認することに同意します</label>
    <p class="note" id="rpjnone" hidden>送った動画・写真はまだありません。送ったあとは、ここで選べます。</p>
    <span class="lbl" id="rpil">スクリーンショット（任意・3枚まで）</span>
    <p class="note" id="rpinote" style="margin:0 0 8px">エラー画面や、顔が隠れていない場面の画面写真があると調べやすくなります（1枚10MBまで）。</p>
    <label class="btn btn-sec pick" id="rpipick"><input type="file" id="rpi" accept="image/*" multiple aria-labelledby="rpil rpipick" aria-describedby="rpinote">画像を選ぶ</label>
    <ul class="thumbs" id="rpthumbs" aria-label="選んだ画像"></ul>
    <span class="lbl" id="rpvl">画面録画を付ける（1本・100MBまで）</span>
    <label class="btn btn-sec pick" id="rpvpick"><input type="file" id="rpv" accept="video/*" aria-labelledby="rpvl rpvpick">動画を選ぶ</label>
    <ul class="thumbs" id="rpvsel" aria-label="選んだ動画"></ul>
    <p class="err" id="rpierr" role="alert" hidden></p>
    <button class="btn btn-pri save" type="submit" id="rps">運営に報告を送る</button>
    <div id="rpdone" role="status" hidden><p class="ok" id="rpok"></p><a class="btn btn-ter" href="/home">ホームに戻る</a></div>
    <p class="err" id="rperr" role="alert" hidden></p>
  </form>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
// 問題を報告する
const RP_MAX = 500;
function rpCount() {
  const left = RP_MAX - $('rpb').value.length;
  $('rpn').textContent = left >= 0 ? 'あと' + left + '文字' : (-left) + '文字多すぎます';
  $('rpn').classList.toggle('over', left < 0);
}
$('rpb').addEventListener('input', rpCount);
api('/api/jobs').then(jobs => {
  if (!jobs.length) { $('rpj').hidden = true; $('rpjnone').hidden = false; }
  jobs.forEach(j => {
    const d = new Date(j.created_at * 1000);
    const what = j.kind === 'video' ? '動画 ' + mmss(j.duration_sec) : '写真';
    const st = j.kind === 'video' ? (VIDEO_STATUS[j.status] || ['', ''])[0] : ({ done: '完成', deleted: '削除済み' }[j.status] || '');
    const o = document.createElement('option');
    o.value = j.id;
    o.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + what + (st ? '（' + st + '）' : '');
    $('rpj').append(o);
  });
}).catch(() => {});
// スクリーンショット（最大3枚・1枚10MB）
const RP_IMG_MAX = 3, RP_IMG_BYTES = 10 * 1024 * 1024;
let rpFiles = [];
function rpImgErr(msg) { $('rpierr').textContent = msg || ''; $('rpierr').hidden = !msg; }
function rpRender() {
  const ul = $('rpthumbs');
  ul.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
  ul.replaceChildren();
  rpFiles.forEach((f, i) => {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = f.name; img.src = URL.createObjectURL(f);
    img.onerror = () => { const d = document.createElement('div'); d.className = 'noprev'; d.textContent = 'プレビューできません（送れます）'; img.replaceWith(d); };
    const fn = document.createElement('span'); fn.className = 'fn'; fn.textContent = f.name; fn.title = f.name;
    const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '外す';
    rm.setAttribute('aria-label', f.name + ' を外す');
    rm.addEventListener('click', () => { rpFiles.splice(i, 1); rpImgErr(''); rpRender(); });
    li.append(img, fn, rm); ul.append(li);
  });
  const full = rpFiles.length >= RP_IMG_MAX;
  $('rpipick').lastChild.textContent = full ? '3枚選びました（外すと選び直せます）'
    : rpFiles.length ? '画像を追加する（あと' + (RP_IMG_MAX - rpFiles.length) + '枚）' : '画像を選ぶ';
  $('rpipick').classList.toggle('full', full);
  $('rpi').disabled = full;
}
$('rpi').addEventListener('change', () => {
  const add = [...$('rpi').files];
  $('rpi').value = '';
  rpImgErr('');
  const big = add.filter(f => f.size > RP_IMG_BYTES);
  const ok = add.filter(f => f.size <= RP_IMG_BYTES);
  if (rpFiles.length + ok.length > RP_IMG_MAX) { rpImgErr('画像は3枚までです'); return; }
  if (big.length) rpImgErr('画像は1枚10MBまでです（' + big.map(f => f.name).join('、') + ' は選べません）');
  rpFiles = rpFiles.concat(ok);
  rpRender();
});
// 対象を選んだら、運営が確認することへの同意（選ばないときは隠して外す）
$('rpj').addEventListener('change', () => {
  const on = !!$('rpj').value;
  $('rpconsentl').hidden = !on;
  if (!on) $('rpconsent').checked = false;
});
// 画面録画（1本・100MB）
const RP_VID_BYTES = 100 * 1024 * 1024;
let rpVideo = null;
function rpVidRender() {
  const ul = $('rpvsel');
  ul.replaceChildren();
  if (rpVideo) {
    const li = document.createElement('li');
    const fn = document.createElement('span'); fn.className = 'fn'; fn.title = rpVideo.name;
    fn.textContent = rpVideo.name + '（' + Math.max(1, Math.round(rpVideo.size / 1048576)) + 'MB）';
    const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '×';
    rm.setAttribute('aria-label', rpVideo.name + ' を外す');
    rm.addEventListener('click', () => { rpVideo = null; rpImgErr(''); rpVidRender(); });
    li.style.width = 'auto'; li.style.flexDirection = 'row';
    li.append(fn, rm); ul.append(li);
  }
  $('rpvpick').lastChild.textContent = rpVideo ? '別の動画に選び直す' : '動画を選ぶ';
}
$('rpv').addEventListener('change', () => {
  const f = $('rpv').files[0];
  $('rpv').value = '';
  rpImgErr('');
  if (!f) return;
  if (f.size > RP_VID_BYTES) { rpImgErr('動画は1本100MBまでです'); return; }
  rpVideo = f;
  rpVidRender();
});
document.querySelectorAll('input[name=rpc]').forEach(r => r.addEventListener('change', () => { $('rpcerr').hidden = true; }));
$('rpf').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('rpdone').hidden = $('rperr').hidden = $('rpcerr').hidden = true;
  const body = $('rpb').value.trim(), picked = document.querySelector('input[name=rpc]:checked');
  if (!picked) {  // 選択肢の近くに出して、そこまで戻す（下のボタンの横だと画面の外になる）
    $('rpcerr').textContent = 'あてはまるものを選んでください'; $('rpcerr').hidden = false;
    $('rpcerr').scrollIntoView({ block: 'center' }); document.querySelector('input[name=rpc]').focus({ preventScroll: true }); return;
  }
  if (picked.value === 'other' && !body) { $('rperr').textContent = '内容を書いてください'; $('rperr').hidden = false; $('rpb').focus(); return; }
  if ($('rpj').value && !$('rpconsent').checked) {
    $('rperr').textContent = '対象を選んだときは、運営が確認することへの同意にチェックしてください'; $('rperr').hidden = false; $('rpconsent').focus(); return;
  }
  $('rps').disabled = true;
  const sendLabel = $('rps').textContent;
  if (rpVideo) $('rps').textContent = '送信中…';
  try {
    const fd = new FormData();
    fd.append('category', picked.value);
    fd.append('body', body);
    fd.append('job_id', $('rpj').value);
    if ($('rpj').value && $('rpconsent').checked) fd.append('consent', '1');
    rpFiles.forEach(f => fd.append('images', f, f.name));
    if (rpVideo) fd.append('video', rpVideo, rpVideo.name);
    await api('/api/reports', { method: 'POST', body: fd });
    $('rpb').value = ''; $('rpj').value = ''; $('rpconsent').checked = false; $('rpconsentl').hidden = true; picked.checked = false; rpCount();
    rpFiles = []; rpImgErr(''); rpRender(); rpVideo = null; rpVidRender();
    const what = picked.closest('label').textContent.trim();
    $('rpok').textContent = '報告を受け付けました（' + what + '）。運営が確認します';
    $('rpdone').hidden = false;
  } catch (e) { $('rperr').textContent = e.message; $('rperr').hidden = false; }
  $('rps').disabled = false;
  $('rps').textContent = sendLabel;
});
</script>
</body></html>
