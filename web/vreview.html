<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>モザイクの確認｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
h1{margin-top:var(--s4)}
.lead{margin:0 0 var(--s4)}
#warn{margin:0 0 var(--s3)}
.seg{margin:0 0 var(--s4)}
.seg label{min-height:64px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
#rest{margin:var(--s3) 0 0}
#rest .help{margin:0 0 var(--s2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 0 var(--s3)}
.tabs button{min-height:56px;font:inherit;font-size:15px;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--sub);cursor:pointer;padding:var(--s1) 6px;line-height:1.3}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--pri)}
.tabs button .n{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.tabs #tb[aria-selected=true] .n{color:var(--warn-tag)}
.tabs #tk[aria-selected=true] .n{color:var(--keep-ink)}
.help{font-size:14px;color:var(--sub);margin:0 0 var(--s3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.t{position:relative;display:block;padding:0;border:3px solid var(--warn);border-radius:var(--radius-sm);background:var(--paper);overflow:hidden;color:var(--fg);cursor:pointer;font:inherit;text-align:left}
.t img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:var(--surface)}
.t .cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 var(--s1);padding:2px 6px;font-size:12px;line-height:20px}
.t .cap > *{white-space:nowrap}
.t .cap b{color:var(--warn-tag)}
.t.k{border-color:var(--keep)}
.t.k .cap b{color:var(--keep-ink)}
#sm{margin:0 0 var(--s3);border:1px solid var(--line);border-radius:var(--radius-sm)}
#sm summary{display:flex;align-items:center;min-height:48px;padding:var(--s1) var(--s3);font-weight:600;cursor:pointer}
#sm .help{margin:0 var(--s3) var(--s2)}
#sm .grid{padding:0 var(--s2) var(--s2)}
.empty{grid-column:1/-1;background:var(--surface);border-radius:var(--radius-sm);color:var(--sub);font-size:14px;padding:var(--s3) var(--s4);margin:0}
.repick{margin:var(--s5) 0 0}
.seg.q{grid-template-columns:1fr}
.seg.q .d{font-size:14px}
.qone{margin:calc(-1 * var(--s1)) 0 var(--s4);font-size:14px;line-height:1.5;color:var(--sub)}
.qone p{margin:0}
.qone a{display:inline-flex;align-items:center;min-height:44px}
#toast{position:fixed;left:var(--s4);right:var(--s4);z-index:11;text-align:center;background:var(--fg);color:var(--on-pri);font-size:14px;border-radius:var(--radius-sm);padding:var(--s3);
  opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#ft{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--line);background:var(--paper);
  padding:var(--s2) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#undo{min-height:48px;font-size:16px}
#ferr{margin:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<main class="wrap" id="main">
  <ol class="steps"><li class="done">1 送る</li><li class="done">2 選ぶ</li><li class="on">3 確認</li><li>4 保存</li></ol>
  <h1>モザイクの確認</h1>
  <p class="lead">顔をタップすると、もう一方の列に移ります。</p>
  <p class="notice warn" id="warn" role="status" hidden></p>
  <fieldset class="seg seg3">
    <legend>確認する顔の数</legend>
    <label><input type="radio" name="rank" value="A" checked><span><span class="m">すべて</span><span class="d" id="rdA"></span></span></label>
    <label><input type="radio" name="rank" value="B"><span><span class="m">半分</span><span class="d" id="rdB"></span></span></label>
    <label><input type="radio" name="rank" value="C"><span><span class="m">1割</span><span class="d" id="rdC"></span></span></label>
  </fieldset>
  <fieldset class="seg">
    <legend>モザイクの種類（標準はブロック粗め）</legend>
    <label><input type="radio" name="st" value="pixel" checked><span><span class="m">ブロック粗め</span><span class="d">マス目で強く隠す</span></span></label>
    <label><input type="radio" name="st" value="blur"><span><span class="m">すりガラス</span><span class="d">ぼかして隠す。約2.5分長くかかります</span></span></label>
  </fieldset>
  <fieldset class="seg q" id="qual" hidden>
    <legend>画質</legend>
    <label><input type="radio" name="q" value="1080"><span><span class="m">1080p</span><span class="d" id="qd0"></span></span></label>
    <label><input type="radio" name="q" value="src" checked><span><span class="m">元の画質</span><span class="d" id="qd1"></span></span></label>
  </fieldset>
  <div class="qone" id="qone" hidden><p id="qest"></p><p id="qup" hidden><a href="/plans">元の画質（4K など）で書き出すには高画質オプション</a></p></div>
  <div class="tabs" role="tablist" aria-label="モザイクの予定">
    <button type="button" role="tab" id="tb" aria-controls="pb" aria-selected="true">モザイクをかける予定<span class="n" id="nb">0件</span></button>
    <button type="button" role="tab" id="tk" aria-controls="pk" aria-selected="false" tabindex="-1">かけない予定<span class="n" id="nk">0件</span></button>
  </div>
  <section role="tabpanel" id="pb" aria-labelledby="tb">
    <p class="help">モザイクが不要なもの（ダンサー・キャラクター・風船・手や靴など）をタップしてください。</p>
    <details id="sm" hidden>
      <summary id="smt"></summary>
      <p class="help">これらの顔にもモザイクがかかります。モザイクが不要なものがあればタップしてください。</p>
      <div class="grid" id="gs"></div>
    </details>
    <div class="grid" id="gb"></div>
    <div id="rest" hidden>
      <p class="help" id="restt"></p>
      <button class="btn btn-sec" id="resta" type="button"></button>
    </div>
  </section>
  <section role="tabpanel" id="pk" aria-labelledby="tk" hidden>
    <p class="help">モザイクが必要なもの（観客の顔）が混じっていたらタップしてください。</p>
    <div class="grid" id="gk"></div>
  </section>
  <a class="btn btn-ter repick" id="repick" hidden>場面の写真から選び直す</a>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ft">
  <button class="btn btn-sec" id="undo" type="button" disabled>1つ戻す</button>
  <p class="err" id="ferr" hidden></p>
  <button class="btn btn-pri" id="go" type="button">この内容で書き出す</button>
</div>
<script src="/static/common.js"></script>
<script>
const id = jobIdFromPath(), $ = x => document.getElementById(x);
let ITEMS = [], KEEP = new Set(), HIST = [], tab = 'b', toastT = 0, HQ = false, CHOICE = false;
const mins = s => Math.max(1, Math.round(s / 60));
const style = () => document.querySelector('input[name=st]:checked').value;
const wantHq = () => CHOICE ? document.querySelector('input[name=q]:checked').value === 'src' : HQ;
const goLabel = () => wantHq() ? '元の画質で書き出す' : '1080p で書き出す';
// 確認する顔の数: A=すべて B=目立つ順の上位 50% C=上位 10%。隠れた顔も書き出しではモザイクになる
const RANK = { A: [1, 'いちばん正確'], B: [0.5, '上位 50%'], C: [0.1, '上位 10%'] };
const rank = () => document.querySelector('input[name=rank]:checked').value;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
};

function render() {
  const all = ITEMS.filter(it => !KEEP.has(it.id)), k = ITEMS.filter(it => KEEP.has(it.id));
  const cnt = r => Math.ceil(all.length * RANK[r][0]);
  const top = new Set([...all].sort((x, y) => (x.small - y.small) || ((y.score || 0) - (x.score || 0))).slice(0, cnt(rank())));
  const vis = all.filter(it => top.has(it)), rest = all.length - vis.length;
  const b = vis.filter(it => !it.small), s = vis.filter(it => it.small);
  for (const r in RANK) $('rd' + r).textContent = cnt(r) + '件・' + RANK[r][1];
  $('rest').hidden = !rest;
  $('restt').textContent = 'ほかに ' + rest + ' 件の顔は自動でモザイクになります（ここには出していません）';
  $('resta').textContent = rest + ' 件をすべて見る';
  const far = s.length ? '＋遠く ' + s.length : '';
  $('nb').textContent = b.length + '件' + far.replace(' ', ''); $('nk').textContent = k.length + '件';
  $('sm').hidden = !s.length; $('smt').textContent = '遠くの小さい顔 ' + s.length + '件（開くと確認できます）';
  fill($('gb'), b, false); fill($('gk'), k, true);
  if ($('sm').open) fill($('gs'), s, false);
  $('undo').disabled = !HIST.length;
}
function fill(el, items, kept) {
  if (!items.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = kept ? 'ありません。残したいものは「モザイクをかける予定」でタップすると、ここに移ります。'
      : 'ありません。モザイクが必要な顔は「かけない予定」でタップすると、ここに移ります。';
    el.replaceChildren(p); return;
  }
  el.replaceChildren(...items.map(it => {
    const t = document.createElement('button'); t.type = 'button'; t.className = 't' + (kept ? ' k' : '');
    t.setAttribute('aria-label', it.sec + '秒の顔・' + (kept ? 'モザイクなし。タップでモザイクをかける' : 'モザイクあり。タップでモザイクを外す'));
    const im = document.createElement('img'); im.src = '/api/jobs/' + id + '/thumbs/' + it.id + '.jpg'; im.alt = ''; im.loading = 'lazy'; im.width = 200; im.height = 200;
    const cap = document.createElement('span'); cap.className = 'cap';
    const lb = document.createElement('b'); lb.textContent = kept ? 'なし' : 'モザイク';
    const s = document.createElement('span'); s.textContent = it.sec + '秒';
    cap.append(lb, s); t.append(im, cap);
    t.onclick = () => {
      kept ? KEEP.delete(it.id) : KEEP.add(it.id);
      HIST.push(it);
      render(); toast(kept ? '「モザイクをかける予定」に移しました' : '「かけない予定」に移しました');
    };
    return t;
  }));
}
$('undo').onclick = () => {
  const x = HIST.pop().id;
  const back = KEEP.has(x);
  back ? KEEP.delete(x) : KEEP.add(x);
  render(); toast(back ? '1つ戻して「モザイクをかける予定」に戻しました' : '1つ戻して「かけない予定」に戻しました');
};
$('sm').addEventListener('toggle', render);
document.querySelectorAll('input[name=rank]').forEach(r => r.addEventListener('change', () => { store.set('fm_rank', rank()); render(); }));
$('resta').onclick = () => { document.querySelector('input[name=rank][value=A]').checked = true; store.set('fm_rank', 'A'); render(); };
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.bottom = ($('ft').offsetHeight + 12) + 'px'; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
}
function setTab(x) {
  tab = x;
  $('tb').setAttribute('aria-selected', String(x === 'b')); $('tk').setAttribute('aria-selected', String(x === 'k'));
  $('tb').tabIndex = x === 'b' ? 0 : -1; $('tk').tabIndex = x === 'k' ? 0 : -1;
  $('pb').hidden = x !== 'b'; $('pk').hidden = x !== 'k';
}
$('tb').onclick = () => setTab('b');
$('tk').onclick = () => setTab('k');
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = tab === 'b' ? 'k' : 'b'; setTab(n); $('t' + n).focus(); }
});
function fit() { document.body.style.paddingBottom = ($('ft').offsetHeight + 16) + 'px'; }
new ResizeObserver(fit).observe($('ft'));

(async () => {
  let j;
  try { j = await api('/api/jobs/' + id); } catch (e) { $('ferr').textContent = e.message; $('ferr').hidden = false; $('go').disabled = true; return; }
  if (j.status === 'awaiting_pick') { location.replace('/pick/' + id); return; }
  if (!['awaiting_review', 'done'].includes(j.status) || !j.review) { location.replace('/status/' + id); return; }
  if (j.idle_warn) { $('warn').textContent = idleWarnText(j); $('warn').hidden = false; }
  if (j.status === 'awaiting_review') { $('repick').href = '/pick/' + id; $('repick').hidden = false; }
  ITEMS = [...j.review.blur, ...j.review.keep].map(it => ({ ...it, ids: it.ids || [it.id] }));
  KEEP = new Set(ITEMS.filter(it => j.keep.includes(it.id)).map(it => it.id));
  const r0 = store.get('fm_rank');
  if (RANK[r0]) document.querySelector('input[name=rank][value=' + r0 + ']').checked = true;
  document.querySelector('input[name=st][value=' + (j.style === 'blur' ? 'blur' : 'pixel') + ']').checked = true;
  // 画質: 高画質で書き出せる（オプション＋元動画あり）かつ元動画が 1080p30 より重いときだけ 2 択
  HQ = !!j.hq_est_sec; CHOICE = !!j.hq_choice;
  const src = (j.width && j.height ? j.width + '×' + j.height : '元の解像度') + '・' + (j.fps ? Math.round(j.fps) + 'fps' : '元の fps');
  const upd = () => {
    const st = style(), n = j.export_est_sec ? mins(j.export_est_sec[st]) : null, m = HQ ? mins(j.hq_est_sec[st]) : null;
    if (CHOICE) {
      $('qd0').textContent = '1920×1080・30fps。スマホで見るなら十分。書き出し 約 ' + n + ' 分';
      $('qd1').textContent = src + ' のまま。書き出し 約 ' + m + ' 分・ファイルは大きめ';
    } else if (HQ) {
      $('qest').textContent = '書き出し 約 ' + m + ' 分（元の画質 ' + src + ' のまま）';
    } else if (n) {
      $('qest').textContent = '書き出し 約 ' + n + ' 分（1080p）';
    }
    if (!$('go').disabled) $('go').textContent = goLabel();
  };
  document.querySelectorAll('input[name=st], input[name=q]').forEach(r => r.addEventListener('change', upd));
  upd();
  if (CHOICE) $('qual').hidden = false;
  else if (j.export_est_sec) {
    $('qone').hidden = false;
    if (!HQ) api('/api/me').then(me => { if (!me.hq) $('qup').hidden = false; }).catch(() => {});  // オプションなしの人だけ案内
  }
  render(); fit();
})();

$('go').onclick = async () => {
  const go = $('go'); go.disabled = true; go.textContent = '書き出しを受け付けています…'; $('ferr').hidden = true;
  const body = { keep: ITEMS.filter(it => KEEP.has(it.id)).flatMap(it => it.ids), blur: ITEMS.filter(it => !KEEP.has(it.id)).flatMap(it => it.ids),
    style: style(), hq: wantHq(), rank: rank() };
  try {
    await api('/api/jobs/' + id + '/review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    location.href = '/status/' + id;
  } catch (e) {
    $('ferr').textContent = e.message; $('ferr').hidden = false;
    go.disabled = false; go.textContent = goLabel();
  }
};
</script>
</body></html>
