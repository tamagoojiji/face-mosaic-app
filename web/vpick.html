<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>残す顔を選ぶ｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
body{overflow-x:hidden}
#hd{padding:0 var(--s4)}
#hd h1{font-size:20px;margin:var(--s3) 0 var(--s1)}
#hd .lead{font-size:14px;margin:0 0 var(--s2)}
#hd .notice{margin:0 0 var(--s2)}
#sc{display:flex;gap:var(--s3);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:var(--s1) var(--s4) var(--s2);scroll-padding:0 var(--s4);overscroll-behavior-x:contain}
.card{flex:none;margin:0;scroll-snap-align:start}
.ph{position:relative;background:var(--dark);border-radius:var(--radius-sm);overflow:hidden;cursor:zoom-in}
.ph img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.card figcaption{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-size:14px;color:var(--sub);min-height:44px;margin-top:var(--s1)}
.zbtn{min-height:44px;padding:0 var(--s3);font:inherit;font-size:14px;font-weight:600;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--paper);color:var(--pri);cursor:pointer}
/* 顔の枠: 選んだ枠は「緑＋太線＋塗り」。✓ 札は余裕のある枠だけ */
.b{position:absolute;padding:0;margin:0;background:transparent;border:2px solid var(--paper);border-radius:6px;cursor:pointer;box-shadow:0 0 0 1px rgba(14,26,48,.7)}
.b .ck{display:none;position:absolute;right:1px;top:1px;min-width:16px;height:16px;background:var(--keep);color:var(--on-pri);font:700 11px/16px -apple-system,"Hiragino Sans",sans-serif;text-align:center;border-radius:3px;pointer-events:none}
.b.on{border:3px solid var(--keep);background:rgba(21,128,61,.28)}
.b.on.num .ck{display:block}
.b.off{visibility:hidden}
#ft{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--line);background:var(--paper);
  padding:var(--s2) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#cnt{font-size:15px;font-weight:700;line-height:22px}
#ferr,#fwait{margin:0}
#msg{padding:var(--s5) var(--s4)}
#msg p{margin:0 0 var(--s4)}
#vw{position:fixed;inset:0;z-index:20;background:var(--dark);display:flex;flex-direction:column}
#vwbar{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3);padding-top:calc(var(--s2) + env(safe-area-inset-top));background:#16233B;color:var(--on-pri)}
#vwbar span{flex:1;font-size:14px;min-width:0}
#vwbar button{min-width:44px;min-height:44px;padding:0 var(--s3);font:inherit;font-size:18px;border-radius:var(--radius-sm);background:#24324D;color:var(--on-pri);border:1px solid #3A4A68;cursor:pointer}
#vwbar button.close{font-size:15px;font-weight:700;background:var(--pri);border-color:var(--pri)}
#vwsc{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#vwin{position:relative;margin:0 auto}
#vwin img{display:block;width:100%}
/* 拡大表示の間は後ろの画面を描かない（全面を覆うダイアログ・読み上げも拡大表示だけに） */
body.viewing > :not(#vw):not(script){visibility:hidden}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<div id="hd">
  <ol class="steps"><li class="done">1 送る</li><li class="on">2 選ぶ</li><li>3 確認</li><li>4 保存</li></ol>
  <h1>ダンサーの顔やモザイクが不要な場所をタップしてください</h1>
  <p class="lead">観客の顔はタップしなくても全部モザイクになります。選んだ枠は緑になります。左右にスクロールすると別の場面が出ます。</p>
  <p class="notice warn" id="warn" role="status" hidden></p>
</div>
<div id="sc" aria-label="場面の写真"></div>
<div id="ft">
  <span id="cnt" aria-live="polite">選んだ 0 件</span>
  <p class="err" id="ferr" hidden></p>
  <p class="notice" id="fwait" role="status" hidden></p>
  <button class="btn btn-pri" id="go" type="button">決定して確認へ進む</button>
</div>
<div id="msg" hidden></div>
<div id="vw" role="dialog" aria-modal="true" aria-label="拡大表示" hidden>
  <div id="vwbar"><span id="vwt">拡大表示</span>
    <button id="zo" type="button" aria-label="縮小">－</button><button id="zi" type="button" aria-label="拡大">＋</button>
    <button class="close" id="vwc" type="button">戻る</button></div>
  <div id="vwsc"><div id="vwin"></div></div>
</div>
<script src="/static/common.js"></script>
<script>
const id = jobIdFromPath(), $ = x => document.getElementById(x);
const sel = new Set(), sc = $('sc'), ft = $('ft');
let SHOTS = [];

function gone(text, href, label) {
  ['hd', 'sc', 'ft'].forEach(x => $(x).style.display = 'none');
  const m = $('msg'); m.hidden = false;
  const p = document.createElement('p'); p.textContent = text;
  const a = document.createElement('a'); a.className = 'btn btn-pri'; a.href = href || '/upload?type=video'; a.textContent = label || '動画を送り直す';
  m.replaceChildren(p, a);
}
function count() { $('cnt').textContent = '選んだ ' + sel.size + ' 件'; $('go').textContent = sel.size ? '決定して確認へ進む' : '選ばずに確認へ進む'; }
function paintAll() {
  document.querySelectorAll('.b').forEach(e => {
    const on = sel.has(+e.dataset.id);
    e.classList.toggle('on', on);
    e.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('.ph, #vwin').forEach(placeChecks);
  count();
}
function addBoxes(parent, s) {
  s.boxes.forEach(b => {
    const e = document.createElement('button'); e.type = 'button'; e.className = 'b'; e.dataset.id = b.ids[0];
    Object.assign(e.style, { left: b.l + '%', top: b.t + '%', width: b.w + '%', height: b.h + '%' });
    e.setAttribute('aria-label', s.sec + '秒の顔 ' + b.ids[0] + '（選ぶとモザイクをかけない）');
    const ck = document.createElement('span'); ck.className = 'ck'; ck.textContent = '✓'; ck.setAttribute('aria-hidden', 'true'); e.append(ck);
    parent.appendChild(e);
  });
}
// 小さい枠も指で押せるように: 押した点を含む枠（小さい枠は 44px 四方に広げて判定）のうち、いちばん上に重なっているもの
function hitAt(parent, x, y) {
  return [...parent.querySelectorAll('.b:not(.off)')].reverse().find(e => {
    const r = e.getBoundingClientRect(), w = Math.max(r.width, 44), h = Math.max(r.height, 44);
    return Math.abs(x - (r.left + r.width / 2)) <= w / 2 && Math.abs(y - (r.top + r.height / 2)) <= h / 2;
  });
}
function toggleAt(parent, ev) {  // 枠を押したら true（キーボード操作 detail 0 はそのボタン）
  const el = ev.detail === 0 ? ev.target.closest('.b') : hitAt(parent, ev.clientX, ev.clientY);
  if (!el) return false;
  const k = +el.dataset.id; sel.has(k) ? sel.delete(k) : sel.add(k); paintAll();
  return true;
}
// ✓ 札: 枠の内側に収まり、ほかの枠と 4px 以上離れているときだけ出す（密集時は枠の色と太さで示す）
function placeChecks(parent) {
  const els = [...parent.querySelectorAll('.b')], rects = new Map(els.map(e => [e, e.getBoundingClientRect()])), G = 4;
  const view = (parent.closest('#vwsc') || parent).getBoundingClientRect();
  els.forEach(e => {
    e.classList.remove('num');
    if (parent === vin) { const q = rects.get(e); e.classList.toggle('off', q.right <= view.left || q.left >= view.right || q.bottom <= view.top || q.top >= view.bottom); }
    if (!e.classList.contains('on')) return;
    const r = rects.get(e), ck = e.firstChild;
    e.classList.add('num');
    const tw = ck.offsetWidth, th = ck.offsetHeight;
    const T = { l: r.right - 3 - tw - G, t: r.top + 3 - G, r: r.right - 3 + G, b: r.top + 3 + th + G };
    const fits = r.width >= tw + 8 && r.height >= th + 8 && T.l >= view.left && T.r <= view.right && T.t >= view.top && T.b <= view.bottom;
    const clear = els.every(o => o === e || (() => { const q = rects.get(o); return q.right <= T.l || q.left >= T.r || q.bottom <= T.t || q.top >= T.b; })());
    if (!(fits && clear)) e.classList.remove('num');
  });
}
function fit() {
  const fh = ft.offsetHeight;
  document.body.style.paddingBottom = fh + 'px';
  const top = sc.getBoundingClientRect().top + scrollY;
  const availH = Math.max(240, innerHeight - top - fh - 8 - 44 - 12);
  const availW = document.documentElement.clientWidth - 32;
  document.querySelectorAll('.card').forEach(c => {
    const r = (+c.dataset.w) / (+c.dataset.h);
    c.style.width = Math.floor(Math.min(availW * (SHOTS.length > 1 ? 0.86 : 1), availH * r)) + 'px';
  });
  document.querySelectorAll('.ph').forEach(placeChecks);
}
// ---- 拡大表示（ボタン・ピンチ）
let zoom = 1, base = 0, cur = null;
const vw = $('vw'), vin = $('vwin'), vsc = $('vwsc');
function setZoom(z, cx, cy) {
  const old = zoom; zoom = Math.min(6, Math.max(1, z));
  const r = vsc.getBoundingClientRect(); cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  const px = (vsc.scrollLeft + cx) / old, py = (vsc.scrollTop + cy) / old;
  vin.style.width = (base * zoom) + 'px'; vsc.scrollLeft = px * zoom - cx; vsc.scrollTop = py * zoom - cy;
  placeChecks(vin);
  $('vwt').textContent = Math.round(zoom * 100) + '%・枠をタップで選択';
}
function openViewer(s) {
  cur = s; vin.replaceChildren();
  const im = document.createElement('img'); im.src = '/api/jobs/' + id + '/shots/' + s.img + '.jpg'; im.alt = s.sec + '秒の場面（拡大）';
  vin.appendChild(im); addBoxes(vin, s); paintAll();
  vw.hidden = false; document.body.style.overflow = 'hidden'; document.body.classList.add('viewing');
  const r = vsc.getBoundingClientRect(); base = Math.min(r.width, r.height * s.w / s.h); zoom = 1; setZoom(2);
  $('vwc').focus();
}
function closeViewer() { vw.hidden = true; document.body.style.overflow = ''; document.body.classList.remove('viewing'); vin.replaceChildren(); }
$('zi').onclick = () => setZoom(zoom * 1.5);
$('zo').onclick = () => setZoom(zoom / 1.5);
$('vwc').onclick = closeViewer;
vin.addEventListener('click', ev => toggleAt(vin, ev));
vsc.addEventListener('scroll', () => placeChecks(vin), { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !vw.hidden) closeViewer(); });
vsc.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); const r = vsc.getBoundingClientRect(); setZoom(zoom * Math.exp(-e.deltaY / 200), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pts = new Map(); let pd = 0, pz = 1;
vsc.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); if (pts.size === 2) { const [a, b] = [...pts.values()]; pd = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); pz = zoom; } });
vsc.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2 && pd) { const [a, b] = [...pts.values()]; const r = vsc.getBoundingClientRect(); setZoom(pz * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pd, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); }
});
['pointerup', 'pointercancel'].forEach(t => vsc.addEventListener(t, e => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; }));
document.addEventListener('gesturestart', e => e.preventDefault());
new ResizeObserver(fit).observe(ft);
window.addEventListener('resize', fit);

(async () => {
  let j;
  try { j = await api('/api/jobs/' + id); } catch (e) { gone(e.message); return; }
  if (j.status === 'deleted') { gone('時間がたったので、この動画は削除しました。'); return; }
  if (j.status === 'done') { location.replace('/done/' + id); return; }
  if (!['awaiting_pick', 'awaiting_review'].includes(j.status)) { location.replace('/status/' + id); return; }
  if (j.idle_warn) { $('warn').textContent = idleWarnText(j); $('warn').hidden = false; }
  (j.picks || []).forEach(k => sel.add(k));
  SHOTS = j.shots || [];
  if (!SHOTS.length) {
    $('sc').style.display = 'none';
    const p = document.createElement('p'); p.className = 'lead'; p.style.padding = '0 16px';
    p.textContent = '選べる大きさの顔が見つかりませんでした。このまま確認へ進んでください。'; $('hd').append(p);
  }
  SHOTS.forEach((s, i) => {
    const f = document.createElement('figure'); f.className = 'card'; f.dataset.w = s.w; f.dataset.h = s.h;
    const p = document.createElement('div'); p.className = 'ph';
    const im = document.createElement('img'); im.src = '/api/jobs/' + id + '/shots/' + s.img + '.jpg'; im.alt = s.sec + '秒の場面';
    im.width = s.w; im.height = s.h; if (i > 1) im.loading = 'lazy';
    p.appendChild(im); addBoxes(p, s);
    p.addEventListener('click', ev => { if (!toggleAt(p, ev)) openViewer(s); });
    const c = document.createElement('figcaption');
    const t = document.createElement('span'); t.textContent = s.sec + '秒・' + (i + 1) + '/' + SHOTS.length;
    const z = document.createElement('button'); z.type = 'button'; z.className = 'zbtn'; z.textContent = '拡大する'; z.onclick = () => openViewer(s);
    c.append(t, z); f.append(p, c); sc.append(f);
  });
  paintAll(); fit();
})();

// 顔と服の特徴の計算が終わっていないと 202 が返る。3 秒おきに自動で送り直す（最大 2 分）
const WAIT_MS = 120000;
$('go').onclick = async () => {
  const go = $('go'), t0 = Date.now(); go.disabled = true; go.textContent = '確認画面を準備しています…'; $('ferr').hidden = true;
  try {
    for (;;) {
      const r = await api('/api/jobs/' + id + '/picks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ picks: [...sel] }) });
      if (!r || r.status !== 'features_pending') break;
      if (Date.now() - t0 >= WAIT_MS) {
        $('fwait').hidden = true;
        $('ferr').textContent = '時間がかかっています。もう一度「確認へ進む」を押してください'; $('ferr').hidden = false;
        go.disabled = false; count(); return;
      }
      $('fwait').textContent = '顔の特徴を計算中です。もう少しお待ちください'; $('fwait').hidden = false;
      await new Promise(ok => setTimeout(ok, (r.retry_after || 3) * 1000));
    }
    location.href = '/review/' + id;
  } catch (e) {
    $('fwait').hidden = true;
    $('ferr').textContent = e.message; $('ferr').hidden = false;
    go.disabled = false; count();
  }
};
</script>
</body></html>
