<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>公式 LINE｜顔モザイク 運営</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/admin.css">
<style>
.a-in.n{width:120px}
code{font-size:12px;word-break:break-all;user-select:all}
</style>
</head><body>
<header class="a-top">
  <a class="brand" href="/admin">顔モザイク 運営</a>
  <nav aria-label="管理メニュー"><a href="/admin">ダッシュボード</a><a href="/admin/users">利用者</a><a href="/admin/jobs">ジョブ</a><a href="/admin/reports">通報</a><a href="/admin/line" aria-current="page">公式 LINE</a><a href="/admin/zukai">図解</a><a href="/admin/settings">設定</a></nav>
  <a class="out" href="/home">利用者画面へ</a>
</header>
<main class="a-main">
  <h1>公式 LINE</h1>
  <p class="a-lead">通知用の公式 LINE は 1 つにつき定員まで（標準 5 人）。新しく登録する人は、空きのある一番小さい番号に入ります。受付用は友だち追加・メッセージに番号の案内を返信するだけで、通知には使いません。</p>
  <p class="msg err" id="err" role="alert" hidden></p>
  <div class="a-box tbl-wrap" id="list"></div>
  <section class="a-box a-pad" style="margin-top:16px" aria-labelledby="h-form">
    <h2 id="h-form" style="margin-top:0">追加・編集</h2>
    <p class="hint" style="margin:0 0 12px">一覧の「編集」を押すとここに入ります。同じ番号で保存すると上書きです。</p>
    <form id="f" novalidate>
      <div class="form-grid">
        <div class="fld"><label for="no">番号</label><input class="a-in n" type="number" min="0" step="1" id="no"><span class="hint">受付用は 0 を推奨</span></div>
        <div class="fld"><label for="name">名前</label><input class="a-in" id="name" placeholder="らくらくモザイク②" autocomplete="off"></div>
        <div class="fld"><label for="kind">種別</label><select class="a-sel" id="kind"><option value="notify">通知用（番号付き）</option><option value="reception">受付用（返信だけ）</option></select></div>
        <div class="fld"><label for="basic_id">ベーシック ID</label><input class="a-in" id="basic_id" placeholder="@xxxxxxxx" autocomplete="off"></div>
        <div class="fld"><label for="capacity">定員</label><div class="unit"><input class="a-in n" type="number" min="0" step="1" id="capacity" value="5"><span>人</span></div></div>
        <div class="fld"><span>使う</span>
          <label class="sw2"><input type="checkbox" id="active" checked><span class="track" aria-hidden="true"></span><span id="actives">ON</span></label></div>
        <div class="fld"><label for="access_token">チャネルアクセストークン（長期）</label><input class="a-in" type="password" id="access_token" autocomplete="new-password"><span class="hint">空なら変更しません。保存後は表示しません</span></div>
        <div class="fld"><label for="channel_secret">チャネルシークレット</label><input class="a-in" type="password" id="channel_secret" autocomplete="new-password"><span class="hint">空なら変更しません。保存後は表示しません</span></div>
      </div>
      <div class="actions"><button class="a-btn pri" type="submit" id="save">保存する</button><p class="msg" id="msg" role="status"></p></div>
    </form>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
<script>
let rows = [];
const KIND = { reception: '受付', notify: '通知' };
function render(d) {
  rows = d.channels;
  fill($('list'), rows.length ? table(
    [['番号', 'num'], ['名前'], ['種別', 'nw'], ['ベーシック ID', 'nw'], ['人数／定員', 'num'], ['使う', 'nw'], ['トークン', 'nw'], ['シークレット', 'nw'], ['Webhook URL'], ['', 'nw']],
    rows.map(c => [String(c.no), c.name, KIND[c.kind] || c.kind, c.basic_id || h('span', { class: 'sub' }, '—'),
      c.kind === 'notify' ? c.used + ' / ' + c.capacity : '—',
      badge(c.active ? 'ON' : 'OFF', c.active ? 'ok' : ''),
      c.token_tail ? '設定済み（…' + c.token_tail + '）' : badge('未設定', 'bad'),
      c.secret_set ? '設定済み' : badge('未設定', 'bad'),
      h('code', {}, c.webhook_url),
      h('button', { class: 'a-btn ter', type: 'button', onclick: () => edit(c) }, '編集')]))
    : empty('公式 LINE はまだありません', '下のフォームで追加すると、ここに Webhook URL が出ます'));
}
function edit(c) {
  $('no').value = c.no; $('name').value = c.name; $('kind').value = c.kind; $('basic_id').value = c.basic_id || '';
  $('capacity').value = c.capacity; $('active').checked = c.active; $('actives').textContent = c.active ? 'ON' : 'OFF';
  $('access_token').value = ''; $('channel_secret').value = '';
  $('msg').textContent = '';
  $('h-form').scrollIntoView({ behavior: 'smooth' });
}
$('active').addEventListener('change', () => { $('actives').textContent = $('active').checked ? 'ON' : 'OFF'; });
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('msg').textContent = '';
  if ($('no').value === '') { $('msg').className = 'msg err'; $('msg').textContent = '番号を入れてください'; return; }
  $('save').disabled = true;
  const body = { name: $('name').value, kind: $('kind').value, basic_id: $('basic_id').value, capacity: $('capacity').value,
    active: $('active').checked ? 1 : 0, access_token: $('access_token').value, channel_secret: $('channel_secret').value };
  try {
    const d = await api('/admin/api/line/' + Number($('no').value), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    render(d);
    $('access_token').value = ''; $('channel_secret').value = '';
    $('msg').className = 'msg ok';
    $('msg').textContent = d.changed.length ? '保存しました（' + d.changed.length + ' 項目・記録に残しました）' : '変更はありませんでした';
  } catch (e) { $('msg').className = 'msg err'; $('msg').textContent = e.message; }
  $('save').disabled = false;
});
api('/admin/api/line').then(render).catch(e => showErr($('err'), e));
</script>
</body></html>
