<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>図解｜顔モザイク 運営</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/admin.css">
<style>
.z-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.z-tabs button{min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}
.z-tabs button[aria-selected=true]{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.z-tabs .src{margin-left:auto;font-size:13px}
.z-frame{width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head><body>
<header class="a-top">
  <a class="brand" href="/admin">顔モザイク 運営</a>
  <nav aria-label="管理メニュー"><a href="/admin">ダッシュボード</a><a href="/admin/users">利用者</a><a href="/admin/jobs">ジョブ</a><a href="/admin/reports">通報</a><a href="/admin/line">公式 LINE</a><a href="/admin/zukai" aria-current="page">図解</a><a href="/admin/settings">設定</a></nav>
  <a class="out" href="/home">利用者画面へ</a>
</header>
<main class="a-main">
  <h1>図解</h1>
  <p class="a-lead">全体像（宣伝 → 販売 → 利用）と、オープンチャットからの登録導線。中身は 2026-10-31 時点の記録です。</p>
  <div class="z-tabs" role="tablist">
    <button type="button" role="tab" id="t-overview" data-src="/admin/zukai/overview" data-art="https://claude.ai/artifact/Abk12ribcy8kxwj3mxDG5Z">全体像</button>
    <button type="button" role="tab" id="t-flow" data-src="/admin/zukai/flow" data-art="https://claude.ai/artifact/F4gBCab1WPiXaD6dfo81rf">登録導線</button>
    <a class="src" id="art" target="_blank" rel="noopener">claude.ai の artifact で開く</a>
  </div>
  <iframe class="z-frame" id="frame" title="図解"></iframe>
</main>
<script>
const tabs = [...document.querySelectorAll('.z-tabs [role=tab]')];
function show(id) {
  const t = tabs.find(b => b.id === 't-' + id) || tabs[0];
  tabs.forEach(b => b.setAttribute('aria-selected', b === t ? 'true' : 'false'));
  document.getElementById('frame').src = t.dataset.src;
  document.getElementById('art').href = t.dataset.art;
  history.replaceState(null, '', '#' + t.id.slice(2));
}
tabs.forEach(b => b.addEventListener('click', () => show(b.id.slice(2))));
show(location.hash.slice(1));
</script>
</body></html>
