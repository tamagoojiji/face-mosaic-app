<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>利用者の詳細｜顔モザイク 運営</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/admin.css">
</head><body>
<header class="a-top">
  <a class="brand" href="/admin">顔モザイク 運営</a>
  <nav aria-label="管理メニュー"><a href="/admin">ダッシュボード</a><a href="/admin/users" aria-current="page">利用者</a><a href="/admin/jobs">ジョブ</a><a href="/admin/reports">通報</a><a href="/admin/settings">設定</a></nav>
  <a class="out" href="/home">利用者画面へ</a>
</header>
<main class="a-main">
  <a class="crumb" href="/admin/users">‹ 利用者の一覧に戻る</a>
  <h1 id="title">利用者</h1>
  <p class="a-lead" id="lead"></p>
  <p class="msg err" id="err" role="alert" hidden></p>
  <div class="cols">
    <section class="a-box a-pad" aria-labelledby="h-info">
      <h2 id="h-info" style="margin-top:0">情報</h2>
      <dl class="dl" id="info"></dl>
    </section>
    <section class="a-box a-pad" aria-labelledby="h-op">
      <h2 id="h-op" style="margin-top:0">プランと権限を変える</h2>
      <form id="f" novalidate>
        <div class="form-grid">
          <div class="fld"><label for="plan">プラン</label><select class="a-sel" id="plan"></select></div>
          <div class="fld"><span>高画質オプション</span>
            <label class="sw2"><input type="checkbox" id="hq"><span class="track" aria-hidden="true"></span><span id="hqs">OFF</span></label>
            <span class="hint" id="hqhint">動画A・動画B のときだけ付けられます</span></div>
          <div class="fld"><label for="role">権限</label><select class="a-sel" id="role"><option value="user">user（利用者）</option><option value="tester">tester（テスター・上限なし）</option><option value="admin">admin（運営）</option></select></div>
          <div class="fld" id="tufld" hidden><label for="tester_until">テスターの期限（この日まで）</label><input class="a-sel" type="date" id="tester_until"></div>
          <div class="fld"><label for="status">状態</label><select class="a-sel" id="status"><option value="active">active（利用中）</option><option value="stopped">stopped（停止・ログインできない）</option></select></div>
        </div>
        <p class="hint" style="margin:12px 0 0">ここでの変更は Stripe の契約や請求を変えません（記録と画面の上限だけが変わります）。</p>
        <div class="actions"><button class="a-btn pri" type="submit" id="save">変更を保存する</button><p class="msg" id="msg" role="status"></p></div>
      </form>
    </section>
  </div>
  <h2>ジョブの履歴</h2>
  <div class="a-box tbl-wrap" id="jobs"></div>
  <h2>この人が出した通報</h2>
  <div class="a-box tbl-wrap" id="reports"></div>
  <h2>運営・課金の記録</h2>
  <div class="a-box tbl-wrap" id="audit"></div>
</main>
<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
<script>
const uid = location.pathname.split('/').filter(Boolean).pop();
const CT = { active: '契約中', canceling: '解約処理中', past_due: 'お支払い未確認', free: '無料' };
let hqPlans = [];
function lim(v, unit) { return v == null ? '無制限' : v + unit; }
function render(d) {
  const u = d.user;
  document.title = (u.display_name || 'ゲスト') + '｜顔モザイク 運営';
  $('title').textContent = '#' + u.id + ' ' + (u.display_name || 'ゲスト');
  $('lead').textContent = (u.instagram_username ? '@' + u.instagram_username + '・' : '') + u.login + ' でログイン・登録 ' + day(u.created_at);
  hqPlans = d.hq_plans;
  const rows = [
    ['状態', badge(u.status, u.status === 'active' ? 'ok' : u.status === 'stopped' ? 'bad' : '')],
    ['プラン', u.plan_label + (u.hq ? '＋高画質' : '') + (u.hq && !u.hq_effective ? '（いまのプランでは無効）' : '')],
    ['契約', [CT[u.contract] || u.contract, u.launch_price ? [' ', badge('記念価格', 'run')] : null]],
    ['次の更新日', u.current_period_end ? day(u.current_period_end) + (u.cancel_at_period_end ? '（この日で解約）' : '') : '—'],
    ['お試しの期限', u.plan !== 'free' ? '—（有料プランのため対象外）' : u.trial_ends_at ? day(u.trial_ends_at) : '—'],
    ['今月の使用量', '動画 ' + u.usage_videos + ' 本・' + mmss(u.usage_video_sec) + '（上限 ' + (u.limits.video_sec_month == null ? '無制限' : mmss(u.limits.video_sec_month)) + '）／写真 ' + u.usage_images + ' 枚（上限 ' + lim(u.limits.images, ' 枚') + '）'],
    ['LINE 連携', u.has_line ? 'あり' : 'なし'],
    ['LINE 通知', u.notify ? 'オン' : 'オフ'],
    ['Stripe 顧客', u.has_stripe_customer ? 'あり' : 'なし'],
    ['Stripe 購読', u.has_subscription ? 'あり' : 'なし'],
    ['規約への同意', u.agreed_at ? dt(u.agreed_at) : '未同意'],
  ];
  if (u.withdrawn_at) rows.push(['退会', dt(u.withdrawn_at) + '・' + (u.withdraw_reason || '') + (u.withdraw_note ? '「' + u.withdraw_note + '」' : '')]);
  fill($('info'), rows.map(r => [h('dt', {}, r[0]), h('dd', {}, r[1])]));
  if (!$('plan').options.length) d.plans.forEach(p => $('plan').append(h('option', { value: p.key }, p.label)));
  $('plan').value = u.plan; $('hq').checked = u.hq; $('role').value = u.role; $('tester_until').value = u.tester_until_date || ''; syncTester(); $('status').value = u.status === 'stopped' ? 'stopped' : 'active';
  syncHq();
  const locked = u.status === 'withdrawn';
  ['plan', 'hq', 'role', 'status', 'save'].forEach(k => $(k).disabled = locked || (k === 'hq' && !hqPlans.includes($('plan').value)));
  if (locked) { $('msg').className = 'msg'; $('msg').textContent = '退会済みのため変更できません'; }

  fill($('jobs'), d.jobs.length ? table(
    [['日時', 'nw'], ['種類', 'nw'], ['状態', 'nw'], ['工程ごとの秒'], ['失敗理由', 'err-t'], ['ID', 'mono']],
    d.jobs.map(j => [dt(j.created_at), j.label + (j.hq_export ? '（高画質）' : ''), jobBadge(j.status), stageText(j), errText(j.error), j.id.slice(0, 8)]))
    : empty('まだ動画・写真を送っていません', '送るとここに工程ごとの時間と一緒に並びます'));
  fill($('reports'), d.reports.length ? table(
    [['日時', 'nw'], ['種類', 'nw'], ['対象', 'nw'], ['内容'], ['画像', 'num'], ['状態', 'nw']],
    d.reports.map(r => [dt(r.created_at), r.stage + ' › ' + r.category_label, r.job_label || '—', r.body || h('span', { class: 'sub' }, '（内容なし）'), r.image_count ? r.image_count + ' 枚' : h('span', { class: 'sub' }, '—'), badge(r.status === 'open' ? '未対応' : '対応済み', r.status === 'open' ? 'warn' : 'ok')]))
    : empty('通報はありません', '設定画面の「問題を報告する」から届いた分がここに並びます'));
  fill($('audit'), d.audit.length ? table(
    [['日時', 'nw'], ['操作した人', 'nw'], ['操作', 'nw'], ['内容']],
    d.audit.map(a => [dt(a.created_at), a.actor_id ? '#' + a.actor_id + ' ' + (a.actor_name || '') : '自動（Stripe など）', a.action, a.detail || '—']))
    : empty('記録はまだありません', 'プランの変更などをするとここに残ります'));
}
function syncHq() {
  const ok = hqPlans.includes($('plan').value);
  $('hq').disabled = !ok;
  if (!ok) $('hq').checked = false;
  $('hqs').textContent = $('hq').checked ? 'ON' : 'OFF';
  $('hqhint').textContent = ok ? '元の解像度・fps で書き出します' : '動画A・動画B のときだけ付けられます';
}
function syncTester() { $('tufld').hidden = $('role').value !== 'tester'; }
$('role').addEventListener('change', syncTester);
$('plan').addEventListener('change', syncHq);
$('hq').addEventListener('change', syncHq);
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('msg').textContent = ''; $('save').disabled = true;
  try {
    const d = await api('/admin/api/users/' + uid, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan: $('plan').value, hq: $('hq').checked, role: $('role').value, tester_until_date: $('role').value === 'tester' ? $('tester_until').value : '', status: $('status').value }) });
    render(d);
    $('msg').className = 'msg ok';
    $('msg').textContent = d.changed.length ? '保存しました（' + d.changed.length + ' 項目・記録に残しました）' : '変更はありませんでした';
  } catch (e) { $('msg').className = 'msg err'; $('msg').textContent = e.message; }
  $('save').disabled = false;
});
api('/admin/api/users/' + uid).then(render).catch(e => showErr($('err'), e));
</script>
</body></html>
