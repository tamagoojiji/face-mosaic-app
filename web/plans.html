<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>プランを比較する｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.now{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin:0 0 8px}
.now .k{font-size:13px;color:var(--sub)}
.now .v{font-weight:700;font-size:17px}
.now .s{font-size:13px;color:var(--fg);margin:4px 0 0}
.plans{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.plan{border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 16px 16px}
.plan.cur{border-color:var(--pri)}
.plan .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px}
.plan .name{font-weight:700;font-size:17px}
.plan .price{font-weight:700;font-size:17px;white-space:nowrap}
.plan .tag{display:inline-block;font-size:12px;font-weight:700;color:#0358B4;background:#E7F1FC;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.plan dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:14px}
.plan dt{color:var(--sub)}
.plan dd{margin:0;font-weight:600;text-align:right}
.plan .pnote{font-size:13px;color:var(--sub);margin:-4px 0 12px}
.opt{border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 16px 16px;margin:16px 0 0}
.opt .d{font-size:14px;margin:4px 0 0}
.opt .pr{font-size:14px;font-weight:600;margin:8px 0 0}
.sw{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;font-weight:700}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{position:relative;flex:none;width:52px;height:32px;border-radius:999px;background:#8E9AB0}
.sw .track::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff}
.sw input:checked + .track{background:var(--pri)}
.sw input:checked + .track::after{left:23px}
.sw input:disabled + .track{opacity:.6}
.sw .lb{flex:1}
.sw .st{font-size:13px;color:var(--sub);font-weight:600}
[hidden]{display:none !important}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<main class="wrap">
  <h1>プランを比較する</h1>
  <div class="now">
    <div class="k">いまのプラン</div>
    <div class="v" id="cur">—</div>
    <p class="s" id="curs"></p>
    <p class="s" id="pend" hidden></p>
  </div>
  <p class="note" id="free" hidden></p>
  <ul class="plans" id="list"></ul>
  <section class="opt" id="opt" aria-labelledby="optl" hidden>
    <label class="sw"><span class="lb" id="optl">高画質オプション ＋500円/月（動画A・B）</span><span class="st" id="optst"></span><input type="checkbox" id="hq" disabled><span class="track" aria-hidden="true"></span></label>
    <p class="d">元の解像度と fps で書き出し（HDR は通常の色に変換）</p>
    <p class="pr" id="optpr"></p>
    <p class="note" id="optnow"></p>
  </section>
  <p class="note" id="prep" hidden>お支払い（月額）の受付は準備中です。始まったら、この画面から申し込めます。</p>
  <p class="note" id="lock" hidden></p>
  <p class="err" id="err" role="alert" hidden></p>
  <div style="height:24px"></div>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const len = s => s % 60 === 0 ? (s / 60) + '分' : mmss(s);
const ORDER = ['free', 'image', 'video_a', 'video_b'];
const md = ts => { const t = new Date(ts * 1000); return (t.getMonth() + 1) + '月' + t.getDate() + '日'; };
function showErr(e) { $('err').textContent = e.message; $('err').hidden = false; }
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
(async () => {
  let d;
  try { d = await api('/api/plans'); } catch (e) { showErr(e); return; }
  const me = d.me, label = k => (d.plans.find(p => p.key === k) || {}).label || k;
  const hqPlans = d.hq_option.plans.map(x => x.key);
  const ready = me.stripe_ready, subscribed = me.sub_status === 'active';
  const canStart = ready && me.plan === 'free' && !['active', 'canceling', 'past_due'].includes(me.sub_status);
  const nextDay = me.current_period_end ? '次の更新日 ' + md(me.current_period_end) : '次の更新日';
  // 次の更新日からの予約（下位へ・高画質外し）を反映した「次の」プランと高画質
  const tgtPlan = me.pending_plan || me.plan;
  const tgtHq = me.pending_hq === 0 ? false : me.hq;
  if (me.pending_plan || me.pending_hq === 0) {
    $('pend').textContent = nextDay + 'から ' + label(tgtPlan) + (tgtHq ? '＋高画質' : '') + ' に変わります';
    $('pend').hidden = false;
  }
  $('prep').hidden = ready;
  if (ready && me.sub_status === 'canceling') { $('lock').textContent = '解約処理中のため、プランは変えられません。'; $('lock').hidden = false; }
  if (ready && me.sub_status === 'past_due') { $('lock').textContent = 'お支払いの確認ができていないため、プランは変えられません。設定の「支払いを管理する」から支払い方法を更新してください。'; $('lock').hidden = false; }
  async function choose(p) {
    $('err').hidden = true;
    try {
      if (canStart) { const r = await post('/api/billing/checkout', { plan: p.key, hq: false }); location.href = r.url; return; }
      const up = ORDER.indexOf(p.key) > ORDER.indexOf(me.plan);
      const hq = tgtHq && hqPlans.includes(p.key);
      const lines = [label(p.key) + (hq ? '＋高画質' : '') + ' に変えます。'];
      if (up) lines.push('すぐに切り替わります（差額は日割り）。');
      else if (p.key !== me.plan) lines.push(nextDay + 'から変わります。');
      if (me.hq && !hq) lines.push('高画質オプションは' + nextDay + 'から外れます。');
      if (!confirm(lines.join('\n'))) return;
      await post('/api/billing/change', { plan: p.key, hq });
      location.reload();
    } catch (e) { showErr(e); }
  }
  $('cur').textContent = me.plan_label + (me.campaign ? '（リリース記念で増量中）' : '');
  $('curs').textContent = quotaLine(me);
  if (me.campaign) { $('free').textContent = '無料プラン: リリース記念の期間は 写真が月' + me.limits.images + '枚・1分までの動画が月' + me.limits.video_count_month + '本 使えます（ふだんは写真5枚・動画なし）。'; $('free').hidden = false; }
  for (const p of d.plans) {
    const li = document.createElement('li'); li.className = 'plan' + (p.key === me.plan ? ' cur' : '');
    const head = document.createElement('div'); head.className = 'head';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = p.label;
    if (p.key === me.plan) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'いまのプラン'; nm.append(t); }
    const pr = document.createElement('div'); pr.className = 'price';
    pr.textContent = '月' + p.price.toLocaleString('ja-JP') + '円';
    head.append(nm, pr);
    const dl = document.createElement('dl');
    const row = (k, v) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); };
    row('動画（1か月）', p.video_sec_month ? len(p.video_sec_month) + 'まで' : 'なし');
    row('1本の長さ', p.video_sec_month && p.video_len ? len(p.video_len) + 'まで' : '—');
    row('写真（1か月）', p.images === null ? '無制限' : p.images + '枚まで');
    row('書き出しの画質', p.quality);
    li.append(head, dl);
    if (p.note) { const n = document.createElement('p'); n.className = 'pnote'; n.textContent = '※ ' + p.note; li.append(n); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sec';
    const isTgt = p.key === tgtPlan;
    if (p.key === me.plan && !me.pending_plan) { b.textContent = 'いまのプランです'; b.disabled = true; }
    else if (!ready) { b.textContent = 'このプランにする（準備中）'; b.disabled = true; }
    else if (p.key === 'free') { b.textContent = '無料プランには戻れません'; b.disabled = true; }
    else if (canStart || (subscribed && !isTgt)) { b.textContent = 'このプランにする'; b.addEventListener('click', () => choose(p)); }
    else if (subscribed && p.key === me.plan) { b.textContent = 'いまのプランのままにする'; b.addEventListener('click', () => choose(p)); }
    else { b.textContent = isTgt ? '次の更新日からのプランです' : 'このプランにする'; b.disabled = true; }
    li.append(b);
    $('list').append(li);
  }
  const o = d.hq_option;
  $('hq').checked = tgtHq;
  $('optpr').textContent = o.plans.map(x => x.label + '＋高画質 月' + x.price.toLocaleString('ja-JP') + '円').join('／');
  const hqOk = ready && subscribed && hqPlans.includes(tgtPlan);
  $('hq').disabled = !hqOk;
  $('optst').textContent = !ready ? '準備中' : tgtHq ? 'オン' : 'オフ';
  $('optnow').textContent = !ready ? (me.hq ? 'いまは高画質オプションが ON です（元の解像度と fps で書き出します）。申し込みの受付は準備中です。' : '申し込みの受付は準備中です。')
    : hqOk ? (me.hq ? 'いまは高画質オプションが ON です（元の解像度と fps で書き出します）。' : '動画A・動画B のときに付けられます。')
    : '動画A・動画B の有料プランのときに付けられます。';
  $('hq').addEventListener('change', async () => {
    $('err').hidden = true;
    const on = $('hq').checked;
    const msg = on ? '高画質オプションを付けます。\nすぐに切り替わります（差額は日割り）。' : '高画質オプションを外します。\n' + nextDay + 'から変わります。';
    if (!confirm(msg)) { $('hq').checked = !on; return; }
    try { await post('/api/billing/change', { plan: tgtPlan, hq: on }); location.reload(); }
    catch (e) { $('hq').checked = !on; showErr(e); }
  });
  $('opt').hidden = false;
})();
function quotaLine(me) {
  const r = me.remaining, parts = [];
  if (!me.video_allowed) parts.push('動画なし');
  else if (r.video_count !== null) parts.push('動画 あと' + r.video_count + '本');
  else if (r.video_sec !== null) parts.push('動画 あと' + mmss(r.video_sec));
  parts.push(r.images === null ? '写真 無制限' : '写真 あと' + r.images + '枚');
  return '今月の残り: ' + parts.join('・');
}
</script>
</body></html>
