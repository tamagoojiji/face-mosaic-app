<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>プランを比較する｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.now{background:var(--surface);border-radius:var(--radius);padding:var(--s3) var(--s4);margin:0}
.now .k{font-size:14px;color:var(--sub)}
.now .v{font-weight:700;font-size:18px}
.now .s{font-size:14px;color:var(--fg);margin:var(--s1) 0 0}
#prep,#lock{margin:var(--s3) 0 0}
#free{margin:var(--s3) 0 0}
.plans{list-style:none;margin:var(--s5) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.plan{border:1.5px solid var(--line);border-radius:var(--radius);padding:var(--s4);background:var(--paper)}
.plan.cur{border-color:var(--pri);border-width:2px}
.plan .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2);margin:0 0 var(--s3)}
.plan .name{font-weight:700;font-size:18px;word-break:keep-all}
.plan .price{margin-left:auto;font-weight:700;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plan .price s{display:block;font-weight:400;font-size:14px;color:var(--sub);text-align:right}
.plan .price .lk{font-size:13px;color:var(--pri-press)}
.plan .lnote{font-size:14px;color:var(--pri-press);font-weight:600;margin:calc(-1 * var(--s2)) 0 var(--s3)}
.plan .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--pri-press);background:var(--pri-soft);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.plan dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s3);margin:0 0 var(--s4);font-size:15px}
.plan dt{color:var(--sub)}
.plan dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.plan .pnote{font-size:14px;color:var(--sub);margin:calc(-1 * var(--s2)) 0 var(--s3)}
.opt{border:1.5px solid var(--line);border-radius:var(--radius);padding:var(--s2) var(--s4) var(--s4);margin:var(--s5) 0 0;background:var(--paper)}
.opt .d{font-size:14px;margin:0}
.opt .pr{font-size:14px;font-weight:600;margin:var(--s2) 0 0}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<main class="wrap">
  <h1>プランを比較する</h1>
  <p class="ok" id="ok" role="status" hidden></p>
  <div class="now">
    <div class="k">いまのプラン</div>
    <div class="v" id="cur">—</div>
    <p class="s" id="curs"></p>
    <p class="s" id="pend" hidden></p>
    <p class="s" id="mine" hidden>あなたはリリース記念価格で利用中です（続けている間はこの価格のままです）</p>
  </div>
  <p class="notice plain" id="prep" hidden>お支払い（月額）の受付は準備中です。始まったら、この画面から申し込めます。</p>
  <p class="notice warn" id="lock" hidden></p>
  <p class="note" id="free" hidden></p>
  <ul class="plans" id="list"></ul>
  <section class="opt" id="opt" aria-labelledby="optl" hidden>
    <label class="sw"><span class="lb" id="optl">高画質オプション <span class="nw">＋500円/月</span><span class="nw">（動画A・B）</span></span><span class="st" id="optst"></span><input type="checkbox" id="hq" disabled><span class="track" aria-hidden="true"></span></label>
    <p class="d">元の解像度と fps で書き出し（HDR は通常の色に変換）</p>
    <p class="pr" id="optpr"></p>
    <p class="note" id="optnow"></p>
  </section>
  <p class="err" id="err" role="alert" hidden></p>
  <div style="height:var(--s5)"></div>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const len = s => s % 60 === 0 ? (s / 60) + '分' : mmss(s);
const md = ts => { const t = new Date(ts * 1000); return (t.getMonth() + 1) + '月' + t.getDate() + '日'; };
function showErr(e) { $('err').textContent = e.message; $('err').hidden = false; }
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const yen = n => n.toLocaleString('ja-JP') + '円';
const ymd = s => { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Number(m[1]) + '月' + Number(m[2]) + '日' : ''; };
(async () => {
  try { const f = sessionStorage.getItem('planFlash'); if (f) { $('ok').textContent = f; $('ok').hidden = false; sessionStorage.removeItem('planFlash'); } } catch (e) { }
  let d;
  try { d = await api('/api/plans'); } catch (e) { showErr(e); return; }
  const me = d.me, lp = d.launch, label = k => (d.plans.find(p => p.key === k) || {}).label || k;
  const hqPlans = d.hq_option.plans.map(x => x.key);
  const ready = me.stripe_ready, subscribed = me.sub_status === 'active';
  const canStart = ready && me.plan === 'free' && !['active', 'canceling', 'past_due'].includes(me.sub_status);
  const nextDay = me.current_period_end ? '次の更新日 ' + md(me.current_period_end) : '次の更新日';
  // 次の更新日からの予約（下位へ・高画質外し）を反映した「次の」プランと高画質
  const tgtPlan = me.pending_plan || me.plan;
  const tgtHq = me.pending_hq === 0 ? false : me.hq;
  if (me.pending_plan || me.pending_hq === 0) {
    $('pend').textContent = nextDay + 'から ' + label(tgtPlan) + (tgtHq ? '＋高画質' : '') + ' に変わります';
    $('pend').hidden = false;
  }
  $('prep').hidden = ready;
  if (ready && me.sub_status === 'canceling') { $('lock').textContent = '解約処理中のため、プランは変えられません。'; $('lock').hidden = false; }
  if (ready && me.sub_status === 'past_due') { $('lock').textContent = 'お支払いの確認ができていないため、プランは変えられません。設定の「支払いを管理する」から支払い方法を更新してください。'; $('lock').hidden = false; }
  // 金額を見せて確認 → 変更。true=変えた／false=やめた（失敗は throw）
  async function changeTo(plan, hq) {
    const pv = await post('/api/billing/preview', { plan, hq });
    const day = pv.next_date ? md(pv.next_date) : '次の更新日';
    const name = label(plan) + (hq ? '＋高画質' : '');
    const msg = pv.immediate.length
      ? '差額' + yen(pv.now) + 'を登録しているカードに請求します。\n次回（' + day + '）からは月' + yen(pv.monthly) + 'になります。\n' + name + 'プランに切り替えますか？'
      : '次回（' + day + '）からは月' + yen(pv.monthly) + 'になります。それまでは今のプランのまま使えます。\n' + name + 'プランに切り替えますか？';
    if (!confirm(msg)) return false;
    const r = await post('/api/billing/change', { plan, hq });
    const flash = pv.immediate.length ? yen(r.charged || 0) + 'を請求しました。プランを ' + name + ' に変えました' : '次回から ' + name + ' に変わります';
    try { sessionStorage.setItem('planFlash', flash); } catch (e) { }
    location.reload();
    return true;
  }
  async function choose(p, b) {
    $('err').hidden = true;
    b.disabled = true;
    try {
      if (canStart) { const r = await post('/api/billing/checkout', { plan: p.key, hq: false }); location.href = r.url; return; }
      const hq = tgtHq && hqPlans.includes(p.key);
      if (!await changeTo(p.key, hq)) b.disabled = false;
    } catch (e) { b.disabled = false; showErr(e); }
  }
  $('cur').textContent = me.plan_label + (me.campaign ? '（リリース記念で増量中）' : '');
  $('curs').textContent = quotaLine(me);
  $('mine').hidden = !lp.mine;
  if (me.campaign) { $('free').textContent = '無料プラン: リリース記念の期間は 写真が月' + me.limits.images + '枚・1分までの動画が月' + me.limits.video_count_month + '本 使えます（ふだんは写真5枚・1分までの動画1本）。'; $('free').hidden = false; }
  for (const p of d.plans) {
    const li = document.createElement('li'); li.className = 'plan' + (p.key === me.plan ? ' cur' : '');
    const head = document.createElement('div'); head.className = 'head';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = p.label;
    if (p.key === me.plan) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'いまのプラン'; nm.append(t); }
    const pr = document.createElement('div'); pr.className = 'price';
    const launchShown = lp.applies && p.regular_price > p.price;
    if (launchShown) {
      const was = document.createElement('s'); was.textContent = '通常価格 月' + yen(p.regular_price);
      const k = document.createElement('span'); k.className = 'lk'; k.textContent = 'リリース記念価格';
      pr.append(was, k, ' 月' + yen(p.price));
    } else pr.textContent = '月' + yen(p.price);
    head.append(nm, pr);
    const dl = document.createElement('dl');
    const row = (k, v) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); };
    row('動画（1か月）', p.video_sec_month ? len(p.video_sec_month) + 'まで' : p.video_count_month ? p.video_count_month + '本まで' : 'なし');
    row('1本の長さ', (p.video_sec_month || p.video_count_month) && p.video_len ? len(p.video_len) + 'まで' : '—');
    row('写真（1か月）', p.images === null ? '無制限' : p.images + '枚まで');
    row('書き出しの画質', p.quality);
    li.append(head);
    if (launchShown && !lp.mine) {  // 契約中の人には上の「リリース記念価格で利用中」1行で伝える
      const ln = document.createElement('p'); ln.className = 'lnote';
      const seg = t => { const sp = document.createElement('span'); sp.className = 'nw'; sp.textContent = t; return sp; };
      if (lp.active && !lp.mine) ln.append(seg(ymd(lp.until) + 'までのお申し込み'), '・');
      ln.append(seg('続けている間はこの価格'));
      li.append(ln);
    }
    li.append(dl);
    if (p.note) { const n = document.createElement('p'); n.className = 'pnote'; n.textContent = '※ ' + p.note; li.append(n); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sec';
    const isTgt = p.key === tgtPlan;
    if (p.key === me.plan && !me.pending_plan) { b.textContent = 'いまのプランです'; b.disabled = true; }
    else if (!ready) { b.textContent = 'このプランにする（準備中）'; b.disabled = true; }
    else if (p.key === 'free') { b.textContent = '無料プランには戻れません'; b.disabled = true; }
    else if (canStart || (subscribed && !isTgt)) { b.textContent = 'このプランにする'; b.addEventListener('click', () => choose(p, b)); }
    else if (subscribed && p.key === me.plan) { b.textContent = 'いまのプランのままにする'; b.addEventListener('click', () => choose(p, b)); }
    else { b.textContent = isTgt ? '次の更新日からのプランです' : 'このプランにする'; b.disabled = true; }
    li.append(b);
    $('list').append(li);
  }
  const o = d.hq_option;
  $('hq').checked = tgtHq;
  $('optpr').replaceChildren(...o.plans.map(x => { const sp = document.createElement('span'); sp.className = 'nw'; sp.textContent = x.label + '＋高画質 月' + x.price.toLocaleString('ja-JP') + '円'; return sp; }).flatMap((sp, i) => i ? ['／', sp] : [sp]));
  const hqOk = ready && subscribed && hqPlans.includes(tgtPlan);
  $('hq').disabled = !hqOk;
  $('optst').textContent = !ready ? '準備中' : tgtHq ? 'オン' : 'オフ';
  $('optnow').textContent = !ready ? (me.hq ? 'いまは高画質オプションが ON です（元の解像度と fps で書き出します）。申し込みの受付は準備中です。' : '申し込みの受付は準備中です。')
    : hqOk ? (me.hq ? 'いまは高画質オプションが ON です（元の解像度と fps で書き出します）。' : '動画A・動画B のときに付けられます。')
    : '動画A・動画B の有料プランのときに付けられます。';
  $('hq').addEventListener('change', async () => {
    $('err').hidden = true;
    const on = $('hq').checked;
    $('hq').disabled = true;
    try { if (!await changeTo(tgtPlan, on)) { $('hq').checked = !on; $('hq').disabled = false; } }
    catch (e) { $('hq').checked = !on; $('hq').disabled = false; showErr(e); }
  });
  $('opt').hidden = false;
})();
function quotaLine(me) {
  const r = me.remaining, parts = [];
  if (!me.video_allowed) parts.push('動画なし');
  else if (r.video_count !== null) parts.push('動画 あと' + r.video_count + '本');
  else if (r.video_sec !== null) parts.push('動画 あと' + mmss(r.video_sec));
  parts.push(r.images === null ? '写真 無制限' : '写真 あと' + r.images + '枚');
  return '今月の残り: ' + parts.join('・');
}
</script>
</body></html>
