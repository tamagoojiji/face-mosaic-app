<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ホーム｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 0;color:var(--fg);text-decoration:none}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface);flex:none}
.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.meta{flex:1;min-width:0}
.meta .t{font-weight:600}
.meta .s{color:var(--sub);font-size:13px}
.badge{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.badge.done{background:#E7F1FC;color:#0358B4}
.badge.pick{background:#FDEEE7;color:var(--warn-tag)}
.badge.busy{background:#EEF2F8;color:var(--fg)}
.sends{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meta .s.warn{color:var(--warn-tag);font-weight:600}
.badge.gone{background:var(--surface);color:var(--sub)}
.chev{flex:none;color:var(--sub);font-size:18px}
.empty{color:var(--sub);margin:8px 0 0}
.meta .s span{display:block}
.quota{margin:24px 0 0;border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.quota .qh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.quota .qh b{font-size:15px}
.quota .qh .pl{font-size:13px;color:var(--sub)}
.quota .camp{display:inline-block;font-size:12px;font-weight:700;color:#0358B4;background:#E7F1FC;border-radius:999px;padding:0 8px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.qgrid .k{font-size:13px;color:var(--sub)}
.qgrid .v{font-size:20px;font-weight:700;line-height:1.3}
.qgrid .s{font-size:12px;color:var(--sub)}
.quota .qhq{font-size:13px;font-weight:600;margin:4px 0 0}
.quota .qlink{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.quota .trial{font-size:12px;font-weight:700;color:var(--warn-tag);background:#FDEEE7;border-radius:999px;padding:0 8px}
.stop{border:1.5px solid var(--warn-tag);border-radius:var(--radius);padding:12px 16px 16px;margin:0}
.stop h2{margin:0 0 4px;font-size:17px}
.stop p{margin:0 0 12px;font-size:14px}
[hidden]{display:none !important}
</style>
</head><body>
<div class="bar"><span class="brand">顔モザイク</span><a class="end" href="/settings">設定</a></div>
<main class="wrap">
  <h1>動画と写真の顔にモザイクをかける</h1>
  <p class="lead">送ると顔を自動で見つけます。残したい人だけタップして、ほかの顔を隠せます。</p>
  <p class="ok" id="paid" role="status" hidden></p>
  <section class="stop" id="stop" aria-labelledby="stoph" hidden>
    <h2 id="stoph"></h2>
    <p id="stopd"></p>
    <a class="btn btn-pri" id="stopplan" href="/plans" hidden>プランを選ぶ</a>
    <button class="btn btn-pri" type="button" id="stoppay" hidden>支払い方法を更新する</button>
    <p class="err" id="stoperr" role="alert" hidden></p>
  </section>
  <div class="sends" id="sends">
    <a class="btn btn-pri" id="sendv" href="/upload?type=video">動画を送る</a>
    <a class="btn btn-pri" id="send" href="/upload?type=photo">写真を送る</a>
  </div>
  <section class="quota" aria-labelledby="qh" id="quota" hidden>
    <div class="qh"><b id="qh">今月の残り <span class="trial" id="qtrial" hidden></span></b><span class="pl" id="qpl"></span></div>
    <div class="qgrid">
      <div><div class="k">動画</div><div class="v" id="qv">—</div><div class="s" id="qvs"></div></div>
      <div><div class="k">写真</div><div class="v" id="qi">—</div><div class="s" id="qis"></div></div>
    </div>
    <p class="qhq" id="qhq" hidden>高画質オプション: ON（元の解像度と fps で書き出します）</p>
    <a class="qlink" href="/plans">プランを比較する</a>
  </section>
  <h2>最近の動画と写真</h2>
  <p class="note" style="margin:0 0 12px" id="keepnote">元の動画・写真は完成から24時間、完成したものは30日で自動で消えます。</p>
  <ul class="list" id="list" hidden></ul>
  <p class="empty" id="empty" hidden>送った動画と写真はここに並びます。</p>
  <p class="err" id="err" hidden></p>
</main>
<script src="/static/common.js"></script>
<script>
// お申し込み直後（Stripe から戻った）
if (new URLSearchParams(location.search).get('paid') === '1') {
  const p = document.getElementById('paid');
  p.textContent = 'お申し込みありがとうございます。使えるようになりました'; p.hidden = false;
  history.replaceState(null, '', '/home');
}
// 利用停止（お試し期限切れ・お支払い未確認）: 送信ボタンと残量を隠して案内だけ
function showBlocked(m) {
  const $ = id => document.getElementById(id);
  $('sends').hidden = true;
  if (m.blocked === 'trial_expired') {
    $('stoph').textContent = 'お試し期間が終わりました';
    $('stopd').textContent = 'プランを選ぶと続けて使えます。完成したものは保存期限まで下の一覧から開けます。';
    $('stopplan').hidden = false;
  } else {
    $('stoph').textContent = 'お支払いの確認ができていません';
    $('stopd').textContent = '支払い方法を更新すると、また使えるようになります。完成したものは消えません。';
    $('stoppay').hidden = false;
    $('stoppay').addEventListener('click', async () => {
      $('stoperr').hidden = true; $('stoppay').disabled = true;
      try { const r = await api('/api/billing/portal', { method: 'POST' }); location.href = r.url; }
      catch (e) { $('stoperr').textContent = e.message; $('stoperr').hidden = false; $('stoppay').disabled = false; }
    });
  }
  $('stop').hidden = false;
}
// 今月の残り（分・枚）
api('/api/me').then(m => {
  const r = m.remaining, $ = id => document.getElementById(id);
  if (m.blocked) { showBlocked(m); return; }
  if (m.trial_days_left !== null) { $('qtrial').textContent = 'お試し あと' + m.trial_days_left + '日'; $('qtrial').hidden = false; }
  $('qpl').textContent = m.plan_label + 'プラン';
  if (m.campaign) { const c = document.createElement('span'); c.className = 'camp'; c.textContent = 'リリース記念で増量中'; $('qpl').append(' ', c); }
  if (!m.video_allowed) { $('qv').textContent = 'なし'; $('qvs').textContent = 'プランを変えると送れます'; }
  else if (r.video_count !== null) { $('qv').textContent = 'あと' + r.video_count + '本'; $('qvs').textContent = '1本' + limitLen(m.video_len) + 'まで'; }
  else { $('qv').textContent = 'あと' + mmss(r.video_sec); $('qvs').textContent = '1本' + limitLen(m.video_len) + 'まで'; }
  $('qi').textContent = r.images === null ? '無制限' : 'あと' + r.images + '枚';
  $('qis').textContent = m.limits.images === null ? '' : '月' + m.limits.images + '枚まで';
  $('keepnote').textContent = '元の動画・写真は完成から' + m.source_hours + '時間、完成したものは' + m.output_days + '日で自動で消えます。';
  $('qhq').hidden = !m.hq;
  $('quota').hidden = false;
}).catch(() => { });

// 完成後の2段の期限（選び直し・保存）
function keepLines(el, j, head) {
  const lines = [];
  if (head) lines.push(head);
  if (j.can_repick) lines.push(repickText(j));
  lines.push(keepText(j));
  el.replaceChildren(...lines.map(t => { const sp = document.createElement('span'); sp.textContent = t; return sp; }));
}

(async () => {
  let jobs;
  try { jobs = await api('/api/jobs'); } catch (e) {
    const el = document.getElementById('err'); el.textContent = e.message; el.hidden = false; return;
  }
  if (!jobs.length) {
    document.getElementById('empty').hidden = false; return;
  }
  const ul = document.getElementById('list'); ul.hidden = false;
  for (const j of jobs) {
    if (j.kind === 'video') { ul.append(videoItem(j)); continue; }
    const li = document.createElement('li');
    const gone = j.status === 'deleted';
    const done = j.status === 'done' && j.has_out;
    const a = document.createElement('a');
    a.className = 'item';
    a.href = gone ? '/upload?type=photo' : done ? '/done/' + j.id : '/pick/' + j.id;
    const d = new Date(j.created_at * 1000);
    const when = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    let thumb;
    if (done) { thumb = document.createElement('img'); thumb.src = '/api/jobs/' + j.id + '/result.jpg'; thumb.alt = ''; thumb.loading = 'lazy'; }
    else { thumb = document.createElement('div'); thumb.classList.add('none'); }
    thumb.classList.add('thumb');
    const meta = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('div'); t.className = 't'; t.textContent = when;
    const s = document.createElement('div'); s.className = 's';
    if (done) keepLines(s, j, 'モザイク ' + j.blur.length + ' 件');
    else s.textContent = gone ? '保存期間が過ぎたので消えました・写真を送り直す' : '選択の途中・' + remainText(j).replace('あと', '残り ');
    meta.append(t, s);
    const b = document.createElement('span');
    b.className = 'badge ' + (gone ? 'gone' : done ? 'done' : 'pick');
    b.textContent = gone ? '削除済み' : done ? '完成' : '選択中';
    a.append(thumb, meta, b);
    const c = document.createElement('span'); c.className = 'chev'; c.textContent = '›'; c.setAttribute('aria-hidden', 'true'); a.append(c);
    li.append(a); ul.append(li);
  }
})();

function videoItem(j) {
  const li = document.createElement('li');
  const a = document.createElement('a'); a.className = 'item'; a.href = videoHref(j);
  const d = new Date(j.created_at * 1000);
  const when = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  let thumb;
  if (j.has_thumb) { thumb = document.createElement('img'); thumb.src = '/api/jobs/' + j.id + '/shots/0.jpg'; thumb.alt = ''; thumb.loading = 'lazy'; }
  else { thumb = document.createElement('div'); thumb.classList.add('none'); thumb.textContent = '動画'; }
  thumb.classList.add('thumb');
  const meta = document.createElement('div'); meta.className = 'meta';
  const t = document.createElement('div'); t.className = 't'; t.textContent = when + (j.duration_sec ? '・' + mmss(j.duration_sec) : '');
  const s = document.createElement('div'); s.className = 's';
  const st = j.status, left = j.expires_at ? remainText(j).replace('あと', '残り ') : '';
  if (st === 'done') keepLines(s, j, j.has_out ? 'できました' : '');
  else if (st === 'deleted') s.textContent = '削除しました・動画を送り直す';
  else if (st === 'failed') s.textContent = j.error || '処理できませんでした';
  else if (st === 'awaiting_pick' || st === 'awaiting_review') {
    if (j.idle_warn) { s.classList.add('warn'); s.textContent = remainText(j) + 'で削除されます'; }
    else s.textContent = (st === 'awaiting_pick' ? '残す顔を選んでください' : 'モザイクを確認してください') + '・' + left;
  } else if (st === 'uploading') s.textContent = '同じ動画を選ぶと続きから送れます';
  else s.textContent = j.ahead ? 'あなたの前に ' + j.ahead + ' 件' : '目安 あと約' + Math.max(1, Math.round((j.eta_sec || 0) / 60)) + '分';
  meta.append(t, s);
  const b = document.createElement('span');
  b.className = 'badge ' + (st === 'done' ? 'done' : st === 'deleted' || st === 'failed' ? 'gone' : st.startsWith('awaiting') ? 'pick' : 'busy');
  b.textContent = (VIDEO_STATUS[st] || VIDEO_STATUS.failed)[0];
  const c = document.createElement('span'); c.className = 'chev'; c.textContent = '›'; c.setAttribute('aria-hidden', 'true');
  a.append(thumb, meta, b, c); li.append(a);
  return li;
}
</script>
</body></html>
