<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>できあがり｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.pv{display:block;width:100%;max-height:60vh;object-fit:contain;background:var(--surface);border-radius:var(--radius);margin:0 0 var(--s3)}
.summary{font-weight:700;margin:0 0 var(--s1)}
.remain{color:var(--sub);font-size:14px;margin:0 0 var(--s4)}
.remain b{color:var(--fg)}
.hint{color:var(--sub);font-size:14px;margin:calc(-1 * var(--s1)) 0 0}
.next{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line)}
.stack.next{padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
.stack:not(:has(*)) + .next{margin-top:var(--s3);padding-top:0;border-top:0}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<main class="wrap" id="main">
  <ol class="steps"><li class="done">1 写真を選ぶ</li><li class="done">2 残す顔を選ぶ</li><li class="on">3 保存する</li></ol>
  <h1>できあがりました</h1>
  <img class="pv" id="pv" alt="モザイクをかけた写真">
  <p class="summary" id="sum"></p>
  <p class="remain" id="remain"></p>
  <div class="stack">
    <button type="button" class="btn btn-pri" id="save">写真に保存する</button>
    <p class="hint" id="saveHint" role="status" hidden>画像を長押しして「"写真"に保存」を選んでください</p>
    <a class="btn btn-sec" id="dl" download>ファイルに保存する（ダウンロード）</a>
  </div>
  <div class="stack next">
    <a class="btn btn-sec" href="/upload?type=photo">もう1枚送る</a>
    <a class="btn btn-ter" id="again">残す顔を選び直す</a>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
const id = jobIdFromPath(), $ = x => document.getElementById(x);
(async () => {
  let j;
  try { j = await api('/api/jobs/' + id); } catch (e) { $('sum').textContent = e.message; return; }
  if (!j.has_out) {
    $('pv').remove(); document.querySelector('h1').textContent = j.status === 'deleted' ? 'この写真は消えました' : 'まだ書き出していません';
    $('sum').textContent = j.status === 'deleted' ? '保存期間が過ぎたので、完成した写真を削除しました。' : '残す顔を選んで「この内容で書き出す」を押してください。';
    $('save').remove(); $('saveHint').remove(); $('dl').remove();
    if (j.status === 'deleted') { $('again').remove(); document.querySelector('.next .btn-sec').className = 'btn btn-pri'; } else $('again').href = '/pick/' + id;
    return;
  }
  const src = '/api/jobs/' + id + '/result.jpg';
  $('pv').src = src + '?t=' + Math.floor(j.now);
  $('dl').href = src + '?dl=1';
  setupSave(src, j);
  if (j.can_repick) $('again').href = '/pick/' + id; else $('again').remove();
  $('sum').textContent = 'モザイク ' + j.blur.length + ' 件・かけない ' + j.keep.length + ' 件（' + (j.style === 'blur' ? 'すりガラス' : 'ブロック粗め') + '）';
  remainLines(j, '元の写真', 'この写真');
})();

// 2段の期限: 選び直し（元データがある間）・保存（完成品）
function remainLines(j, src, out) {
  const line = (b, rest) => { const d = document.createElement('div'), e = document.createElement('b'); e.textContent = b; d.append(e, document.createTextNode(rest)); return d; };
  const rows = [];
  if (j.can_repick) rows.push(line(repickText(j), '（' + src + 'を消すまで）'));
  rows.push(line(keepText(j), '（' + out + 'を消すまで）'));
  $('remain').replaceChildren(...rows);
}

// 写真アプリへ: 共有シート（Web Share API・ファイル付き）→「画像を保存」
function setupSave(src, j) {
  const btn = $('save'), hint = $('saveHint'), label = btn.textContent;
  const d = new Date(j.now * 1000), p = n => String(n).padStart(2, '0');
  const name = 'mosaic_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.jpg';
  let filePromise = null;
  // 押してから share までに時間が空くと iOS がユーザー操作と見なさないため、先に読み込んでおく
  const loadFile = () => filePromise || (filePromise = fetch(src, { credentials: 'same-origin' })
    .then(r => { if (!r.ok) throw new Error('fetch ' + r.status); return r.blob(); })
    .then(b => new File([b], name, { type: 'image/jpeg' }))
    .catch(e => { filePromise = null; throw e; }));
  loadFile().catch(() => { });
  btn.addEventListener('click', async () => {
    hint.hidden = true;
    btn.disabled = true; btn.textContent = '共有シートを開いています…';
    try {
      const file = await loadFile();
      if (!(navigator.canShare && navigator.canShare({ files: [file] }))) throw new Error('share unsupported');
      await navigator.share({ files: [file] });
    } catch (e) {
      if (!(e && e.name === 'AbortError')) hint.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  });
}
</script>
</body></html>
