<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>残す顔を選ぶ｜顔モザイク</title>
<link rel="stylesheet" href="/static/app.css">
<style>
body{overflow-x:hidden}
#hd{padding:0 16px 8px}
#hd h1{font-size:18px;margin:12px 0 4px}
#hd .lead{font-size:13px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px;border:0;padding:0}
.seg legend{font-size:13px;font-weight:700;color:var(--sub);padding:0;margin:0 0 6px}
.seg label{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:6px 10px 6px 36px;
  border:1.5px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.3}
.seg label .m{font-weight:700;font-size:15px}
.seg label .d{font-size:12px;color:var(--sub)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label::before{content:"";box-sizing:border-box;position:absolute;left:10px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid #8E9AB0;background:#fff}
.seg label:has(input:checked){border-color:var(--pri);background:#EEF5FD}
.seg label:has(input:checked)::before{border:5px solid var(--pri)}
.tools{display:flex;align-items:center;gap:8px}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);min-height:44px;cursor:pointer}
.opt input{width:20px;height:20px;margin:0}
.zoom{margin-left:auto;display:flex;gap:6px}
.zoom button{min-width:44px;min-height:44px;font:inherit;font-size:20px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
#sc{overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;background:#0E1A30}
#in{position:relative;margin:0 auto}
#in img{display:block;width:100%;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.b{position:absolute;padding:0;margin:0;background:transparent;border:2px solid var(--warn);border-radius:4px;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.b::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.b .tag{position:absolute;left:0;top:0;background:var(--warn-tag);color:#fff;font:700 12px/1 -apple-system,"Hiragino Sans",sans-serif;padding:3px 4px;border-radius:0 0 4px 0;white-space:nowrap;pointer-events:none}
.b.keep{border-color:var(--keep);border-width:3px;background:rgba(21,128,61,.22)}
.b.keep .tag{background:var(--keep)}
.b.low{border-style:dashed}
.b.low .tag{background:var(--low)}
.b.low.keep .tag{background:var(--keep)}
.b.hide{display:none}
#ft{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--line);background:#fff;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#cnt{font-size:15px;font-weight:700;line-height:22px}
#cnt .k{color:var(--keep)}
#ferr{margin:0}
#msg{padding:24px 16px}
</style>
</head><body>
<div class="bar"><a class="back" href="/home" aria-label="ホームに戻る">‹ ホーム</a></div>
<div id="hd">
  <h1>モザイクをかけない顔をタップ</h1>
  <p class="lead">タップした枠は緑になり、そのまま残ります。オレンジの枠にはモザイクがかかります。</p>
  <fieldset class="seg">
    <legend>モザイクの種類（標準はブロック粗め）</legend>
    <label><input type="radio" name="st" value="pixel" checked><span class="m">ブロック粗め</span><span class="d">マス目で隠す</span></label>
    <label><input type="radio" name="st" value="blur"><span class="m">すりガラス</span><span class="d">ぼかして隠す</span></label>
  </fieldset>
  <div class="tools">
    <label class="opt"><input type="checkbox" id="low"><span id="lowlabel">自信の低い枠も表示</span></label>
    <div class="zoom"><button id="zo" type="button" aria-label="縮小">－</button><button id="zi" type="button" aria-label="拡大">＋</button></div>
  </div>
</div>
<div id="sc"><div id="in"><img id="ph" alt="送った写真"></div></div>
<div id="ft">
  <span id="cnt" aria-live="polite"><span id="cm"></span><span class="k" id="ck"></span></span>
  <p class="err" id="ferr" hidden></p>
  <button class="btn btn-pri" id="go" type="button">この内容で書き出す</button>
</div>
<div id="msg" hidden></div>
<script src="/static/common.js"></script>
<script>
const id = jobIdFromPath(), $ = x => document.getElementById(x);
const keep = new Set(), inn = $('in'), sc = $('sc'), low = $('low'), hd = $('hd'), ft = $('ft');
let D = [], R = 1, zoom = 1, base = 0;

function gone(text) {
  ['hd', 'sc', 'ft'].forEach(x => $(x).style.display = 'none');
  const m = $('msg'); m.hidden = false;
  const p = document.createElement('p'); p.textContent = text;
  const a = document.createElement('a'); a.className = 'btn btn-pri'; a.href = '/upload?type=photo'; a.textContent = '写真を送り直す';
  m.replaceChildren(p, a);
}
function paint(d) {
  const k = keep.has(d.id);
  d.el.classList.toggle('keep', k);
  d.el.firstChild.textContent = k ? '✓' + d.id : String(d.id);
  d.el.setAttribute('aria-label', '枠' + d.id + (k ? ' モザイクをかけない' : ' モザイクをかける'));
  d.el.setAttribute('aria-pressed', String(k));
}
function shown() { return D.filter(d => !d.low || low.checked); }
function count() {
  const s = shown(), m = s.filter(d => !keep.has(d.id)).length;
  $('cm').textContent = 'モザイク ' + m + ' 件・';
  $('ck').textContent = 'かけない ' + (s.length - m) + ' 件';
}
function fit() {
  const fh = ft.offsetHeight;
  document.body.style.paddingBottom = fh + 'px';
  const top = sc.getBoundingClientRect().top + scrollY;
  sc.style.height = Math.max(220, innerHeight - top - fh) + 'px';
  const r = sc.getBoundingClientRect();
  base = Math.min(r.width, r.height * R);
  inn.style.width = (base * zoom) + 'px';
}
function setZoom(z, cx, cy) {
  const old = zoom; zoom = Math.min(6, Math.max(1, z));
  const r = sc.getBoundingClientRect(); cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  const px = (sc.scrollLeft + cx) / old, py = (sc.scrollTop + cy) / old;
  inn.style.width = (base * zoom) + 'px'; sc.scrollLeft = px * zoom - cx; sc.scrollTop = py * zoom - cy;
}
$('zi').onclick = () => setZoom(zoom * 1.5);
$('zo').onclick = () => setZoom(zoom / 1.5);
sc.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); const r = sc.getBoundingClientRect(); setZoom(zoom * Math.exp(-e.deltaY / 200), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const pts = new Map(); let pd = 0, pz = 1;
sc.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); if (pts.size === 2) { const [a, b] = [...pts.values()]; pd = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); pz = zoom; } });
sc.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2 && pd) { const [a, b] = [...pts.values()]; const r = sc.getBoundingClientRect(); setZoom(pz * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pd, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); }
});
['pointerup', 'pointercancel'].forEach(t => sc.addEventListener(t, e => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; }));
document.addEventListener('gesturestart', e => e.preventDefault());
new ResizeObserver(fit).observe(ft);
window.addEventListener('resize', fit);
$('ph').addEventListener('load', fit);
low.onchange = () => { D.forEach(d => { if (d.low) d.el.classList.toggle('hide', !low.checked); }); count(); };

(async () => {
  let j;
  try { j = await api('/api/jobs/' + id); } catch (e) { gone(e.message); return; }
  if (j.status === 'deleted') { gone('この写真は24時間たったので消えました。'); return; }
  R = j.width / j.height;
  if (j.status === 'done') {  // 選び直し: 前回の内容を復元
    j.keep.forEach(k => keep.add(k));
    document.querySelector('input[name=st][value=' + (j.style === 'blur' ? 'blur' : 'pixel') + ']').checked = true;
    if (j.faces.some(f => f.low && (j.keep.includes(f.id) || j.blur.includes(f.id)))) low.checked = true;
  }
  D = j.faces.map(f => ({ id: f.id, low: f.low, conf: f.conf, l: f.x / j.width * 100, t: f.y / j.height * 100, w: f.w / j.width * 100, h: f.h / j.height * 100 }));
  D.slice().sort((a, b) => b.w * b.h - a.w * a.h).forEach(d => {
    const e = document.createElement('button'); e.type = 'button';
    e.className = 'b' + (d.low ? ' low' : '') + (d.low && !low.checked ? ' hide' : '');
    Object.assign(e.style, { left: d.l + '%', top: d.t + '%', width: d.w + '%', height: d.h + '%' });
    const t = document.createElement('span'); t.className = 'tag'; e.appendChild(t); d.el = e; paint(d);
    e.onclick = () => { keep.has(d.id) ? keep.delete(d.id) : keep.add(d.id); paint(d); count(); };
    inn.appendChild(e);
  });
  if (!D.length) $('cm').textContent = '顔は見つかりませんでした';
  else count();
  $('ph').src = '/api/jobs/' + id + '/view.jpg';
  fit();
})();

$('go').onclick = async () => {
  const go = $('go'); go.disabled = true; go.textContent = '書き出しています…'; $('ferr').hidden = true;
  const body = { keep: [...keep], show_low: low.checked, style: document.querySelector('input[name=st]:checked').value };
  try {
    await api('/api/jobs/' + id + '/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    location.href = '/done/' + id;
  } catch (e) {
    $('ferr').textContent = e.message; $('ferr').hidden = false;
    go.disabled = false; go.textContent = 'この内容で書き出す';
  }
};
</script>
</body></html>
