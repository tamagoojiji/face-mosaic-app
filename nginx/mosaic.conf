server {
    listen 80;
    server_name mosaic.tamago-ai-world.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mosaic.tamago-ai-world.com;
    client_max_body_size 30m;

    ssl_certificate /etc/letsencrypt/live/mosaic.tamago-ai-world.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosaic.tamago-ai-world.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 動画の分割アップロード（1回 8MB）。最後の結合（最大1GB）に時間がかかるので待ち時間を長めに
    location /api/uploads {
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_read_timeout 300s;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
