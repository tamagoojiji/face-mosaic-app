# 1 IP あたりの回数制限（api_limit 10r/s・page_limit 30r/s は nginx.conf で定義済み）
# 合言葉ログインの総当たりと、通報（1回 110MB まで）の連打でディスクを埋められるのを止める
limit_req_zone $binary_remote_addr zone=mosaic_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mosaic_report:1m rate=2r/m;

server {
    listen 80;
    server_name mosaic.tamago-ai-world.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mosaic.tamago-ai-world.com;
    client_max_body_size 30m;
    limit_req_status 429;

    # セキュリティヘッダ。frame-ancestors は管理画面の図解（同じサイト内の iframe）があるので 'self'
    # script-src はインラインの script が多いので未指定（指定するなら script を外部ファイルへ移してから）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    ssl_certificate /etc/letsencrypt/live/mosaic.tamago-ai-world.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosaic.tamago-ai-world.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 動画の分割アップロード（1回 8MB）。最後の結合（最大1GB）に時間がかかるので待ち時間を長めに
    location /api/uploads {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 問題の報告（画面録画 1本 100MB まで＋画像）
    location /api/reports {
        limit_req zone=mosaic_report burst=3 nodelay;
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 合言葉ログイン（POST /login）
    location = /login {
        limit_req zone=mosaic_login burst=5 nodelay;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=page_limit burst=100 nodelay;
        proxy_read_timeout 300s;
        set $backend_face_mosaic "face-mosaic-app:8000";
        proxy_pass http://$backend_face_mosaic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
